/* ============================================================
   File Converter — engine (plain JS, no JSX — Node-testable)
   Converts between raster / SVG / simple-vector EPS / PDF-based AI.
   Honest limits (shown in the UI too):
   - EPS: simple vector shapes (moveto/lineto/curveto, fills,
     strokes, flat colors, transforms) — including Illustrator
     files (capital L, u/U groups) and long-form operators
     (moveto/lineto/fill/setrgbcolor, rectfill, arc). Gradients,
     embedded photos, effects and TEXT do not convert.
   - AI: only modern PDF-based .ai files (rendered with pdf.js).
     Old PostScript-only .ai files are treated as EPS.
   - Raster EPS (Photoshop): no vector shapes — the embedded
     preview bitmap (%%BeginPreview) or TIFF preview is used instead.
   ============================================================ */

// ---------- kind detection (magic bytes first, extension as fallback) ----------
// Scans up to 1MB for '%!PS' — some EPS files carry a big binary preview
// BEFORE the PostScript section, so a 4KB window is not enough.
function fcDetectKind(name, bytes) {
  const ext = (name || '').toLowerCase().split('.').pop();
  const head = bytes ? bytes.slice(0, 12) : new Uint8Array(0);
  const isPdf = head[0] === 0x25 && head[1] === 0x50 && head[2] === 0x44 && head[3] === 0x46; // %PDF
  const isPng = head[0] === 0x89 && head[1] === 0x50 && head[2] === 0x4E && head[3] === 0x47;
  const isJpg = head[0] === 0xFF && head[1] === 0xD8 && head[2] === 0xFF;
  const isGif = head[0] === 0x47 && head[1] === 0x49 && head[2] === 0x46;
  const isBmp = head[0] === 0x42 && head[1] === 0x4D;
  const isWebp = head[0] === 0x52 && head[1] === 0x49 && head[2] === 0x46 && head[3] === 0x46
    && head[8] === 0x57 && head[9] === 0x45 && head[10] === 0x42 && head[11] === 0x50;
  const isDosEps = head[0] === 0xC5 && head[1] === 0xD0 && head[2] === 0xD3 && head[3] === 0xC6;
  let ascii = '';
  if (bytes && bytes.length) {
    try { ascii = new TextDecoder('iso-8859-1').decode(bytes.slice(0, 1048576)); }
    catch (e) { ascii = ''; }
  }
  const isPs = isDosEps || ascii.indexOf('%!PS') !== -1;
  const isSvgText = /<\s*svg[\s>]/.test(ascii.slice(0, 2000));
  if (isPng || isJpg || isGif || isBmp || isWebp) return 'raster';
  if (isSvgText) return 'svg';
  if (isPdf) return (ext === 'ai') ? 'ai' : 'pdf';
  if (isPs) return 'eps';
  if (ext === 'svg') return 'svg';
  if (ext === 'eps' || ext === 'esp') return 'eps'; // 'esp' = common misspelling of .eps
  if (ext === 'ai') return 'ai';
  if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'bmp'].indexOf(ext) !== -1) return 'raster';
  if (ext === 'pdf') return 'pdf';
  return 'unknown';
}

function fcKindLabel(kind) {
  return { raster: 'Image', svg: 'SVG', eps: 'EPS', ai: 'AI', pdf: 'PDF', unknown: 'Unknown' }[kind] || kind;
}

// ---------- SVG with embedded raster ----------
function fcSvgEmbed(dataUrl, w, h) {
  return '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '">\n'
    + '  <image href="' + dataUrl + '" width="' + w + '" height="' + h + '" />\n'
    + '</svg>\n';
}

// ---------- mini PostScript (EPS) -> SVG ----------
// Handles BOTH styles found in real EPS files:
//  - abbreviated operators (Illustrator / Cairo): m l c v y h re n f F f* S s B B* b b* rg RG g G k K w d cm q Q
//  - full operator names (matplotlib / CorelDRAW / Ghostscript): moveto lineto curveto
//    closepath newpath fill eofill stroke setrgbcolor setgray setcmykcolor setlinewidth
//    setdash gsave grestore concat translate scale rotate
//  - relative ops: rmoveto rlineto rcurveto
//  - arcs: arc / arcn (approximated with line segments), rectfill / rectstroke
// Procedure bodies { ... } in the prolog are skipped (they only define operators).
function fcEpsParse(epsText) {
  let text = String(epsText || '');
  const psIdx = text.indexOf('%!PS');
  if (psIdx > 0) text = text.slice(psIdx);
  // Take the LAST numeric %%BoundingBox: some files write
  // "%%BoundingBox: (atend)" at the top and the real box at the end.
  const bbAll = [...text.matchAll(/%%BoundingBox:\s*(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)];
  const bb = bbAll.length ? bbAll[bbAll.length - 1] : null;
  const bbox = bb
    ? { x0: parseFloat(bb[1]), y0: parseFloat(bb[2]), x1: parseFloat(bb[3]), y1: parseFloat(bb[4]) }
    : { x0: 0, y0: 0, x1: 600, y1: 600 };
  const width = Math.max(1, bbox.x1 - bbox.x0);
  const height = Math.max(1, bbox.y1 - bbox.y0);

  const shapes = [];
  let warnings = 0;
  let textSeen = false;
  let hasImage = false;

  let ctm = [1, 0, 0, 1, 0, 0];
  let fillColor = 'rgb(0,0,0)';
  let strokeColor = 'rgb(0,0,0)';
  let lineWidth = 1;
  const gsStack = [];
  let segs = [];
  let curPt = null;
  let subStart = null;

  const applyCtm = (x, y) => [ctm[0] * x + ctm[2] * y + ctm[4], ctm[1] * x + ctm[3] * y + ctm[5]];
  const f2 = (n) => { const v = Math.round(n * 100) / 100; return (Object.is(v, -0) ? 0 : v).toString(); };
  const moveTo = (x, y) => {
    const p = applyCtm(x, y);
    segs.push('M ' + f2(p[0]) + ' ' + f2(p[1]));
    curPt = p; subStart = p;
  };
  const lineTo = (x, y) => {
    const p = applyCtm(x, y);
    segs.push('L ' + f2(p[0]) + ' ' + f2(p[1]));
    curPt = p;
  };
  const curveTo = (x1, y1, x2, y2, x3, y3) => {
    const p1 = applyCtm(x1, y1), p2 = applyCtm(x2, y2), p3 = applyCtm(x3, y3);
    segs.push('C ' + f2(p1[0]) + ' ' + f2(p1[1]) + ' ' + f2(p2[0]) + ' ' + f2(p2[1]) + ' ' + f2(p3[0]) + ' ' + f2(p3[1]));
    curPt = p3;
  };
  const closePath = () => { if (segs.length) { segs.push('Z'); if (subStart) curPt = subStart; } };
  const rectPath = (rx, ry, rw, rh) => {
    moveTo(rx, ry); lineTo(rx + rw, ry); lineTo(rx + rw, ry + rh); lineTo(rx, ry + rh); closePath();
  };
  const emit = (paint, fillRule) => {
    if (!segs.length) return;
    const shape = { d: segs.join(' '), fill: 'none', stroke: 'none', strokeWidth: 0, fillRule: fillRule || 'nonzero' };
    if (paint.indexOf('f') !== -1) shape.fill = fillColor;
    if (paint.indexOf('s') !== -1) { shape.stroke = strokeColor; shape.strokeWidth = Math.max(0.1, lineWidth); }
    shapes.push(shape);
    segs = []; curPt = null; subStart = null;
  };
  const rgbStr = (r, g, b) => 'rgb(' + Math.round(r * 255) + ',' + Math.round(g * 255) + ',' + Math.round(b * 255) + ')';
  const cmykToRgb = (c, m, y, k) => rgbStr((1 - c) * (1 - k), (1 - m) * (1 - k), (1 - y) * (1 - k));
  const concatCtm = (m) => {
    // PostScript concat: CTM' = M x CTM (new matrix applied AFTER the old one,
    // so translate-then-scale maps (0,0) -> (200,200), matching PS semantics).
    const o = ctm;
    ctm = [
      m[0] * o[0] + m[2] * o[1], m[1] * o[0] + m[3] * o[1],
      m[0] * o[2] + m[2] * o[3], m[1] * o[2] + m[3] * o[3],
      m[0] * o[4] + m[2] * o[5] + m[4], m[1] * o[4] + m[3] * o[5] + m[5]
    ];
  };
  const arcToSegs = (cx, cy, r, a1deg, a2deg, ccw) => {
    if (!r || r <= 0) return;
    let a1 = a1deg * Math.PI / 180, a2 = a2deg * Math.PI / 180;
    if (ccw) { while (a2 <= a1) a2 += Math.PI * 2; } else { while (a2 >= a1) a2 -= Math.PI * 2; }
    const span = Math.abs(a2 - a1);
    const n = Math.max(8, Math.ceil(span / (Math.PI / 18)));
    for (let k = 0; k <= n; k++) {
      const a = a1 + (a2 - a1) * (k / n);
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      if (k === 0 && !curPt) moveTo(x, y);
      else lineTo(x, y);
    }
  };

  // Tokenizer
  const tokens = [];
  let i = 0;
  const N = text.length;
  const numRe = /^-?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/;
  while (i < N) {
    const ch = text[i];
    if (ch === '%') { while (i < N && text[i] !== '\n') i++; continue; }
    if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r' || ch === '\f') { i++; continue; }
    if (ch === '(') {
      let depth = 1, j = i + 1;
      while (j < N && depth > 0) {
        if (text[j] === '\\') { j += 2; continue; }
        if (text[j] === '(') depth++;
        else if (text[j] === ')') depth--;
        j++;
      }
      tokens.push({ t: 'str', v: text.slice(i, j) });
      i = j; continue;
    }
    if (ch === '[' || ch === ']' || ch === '{' || ch === '}') { tokens.push({ t: 'br', v: ch }); i++; continue; }
    if (text[i] === '<' && text[i + 1] === '<') { tokens.push({ t: 'br', v: '<<' }); i += 2; continue; }
    if (text[i] === '>' && text[i + 1] === '>') { tokens.push({ t: 'br', v: '>>' }); i += 2; continue; }
    if (ch === '/') {
      let j = i + 1;
      while (j < N && !/[\s\[\](){}<>/%]/.test(text[j])) j++;
      tokens.push({ t: 'name', v: text.slice(i + 1, j) });
      i = j; continue;
    }
    const numMatch = numRe.exec(text.slice(i));
    if (numMatch && numMatch[0].length > 0) {
      tokens.push({ t: 'num', v: parseFloat(numMatch[0]) });
      i += numMatch[0].length; continue;
    }
    let j = i;
    while (j < N && !/[\s\[\](){}<>/%]/.test(text[j])) j++;
    if (j > i) { tokens.push({ t: 'op', v: text.slice(i, j) }); i = j; continue; }
    i++;
  }

  const stack = [];
  const popNums = (n) => {
    const out = [];
    for (let k = 0; k < n; k++) {
      let v = null;
      while (stack.length) { const s = stack.pop(); if (s && s.t === 'num') { v = s.v; break; } }
      if (v === null) return null;
      out.unshift(v);
    }
    return out;
  };
  const clearStack = () => { stack.length = 0; };

  // Operator aliases: full PostScript names -> single-letter form
  const ALIAS = {
    moveto: 'm', lineto: 'l', curveto: 'c', closepath: 'h', newpath: 'n',
    fill: 'f', eofill: 'f*', stroke: 'S',
    setrgbcolor: 'rg', setgray: 'g', setcmykcolor: 'k',
    setlinewidth: 'w', setdash: 'd', gsave: 'q', grestore: 'Q', concat: 'cm',
    // Illustrator's abbreviated operators are capitalised: L = lineto,
    // C = curveto, V/Y = curveto variants, H = closepath.
    L: 'l', C: 'c', V: 'v', Y: 'y', H: 'h'
  };
  let braceDepth = 0;

  for (const tok of tokens) {
    if (tok.t === 'br' && (tok.v === '{' || tok.v === '<<')) { braceDepth++; continue; }
    if (tok.t === 'br' && (tok.v === '}' || tok.v === '>>')) { braceDepth = Math.max(0, braceDepth - 1); continue; }
    if (braceDepth > 0) continue; // inside a procedure definition — do not execute
    if (tok.t !== 'op') { stack.push(tok); continue; }
    const rawOp = tok.v;
    const op = ALIAS[rawOp] || rawOp;
    let nums = null;
    switch (op) {
      case 'm': nums = popNums(2); if (nums) moveTo(nums[0], nums[1]); break;
      case 'l': nums = popNums(2); if (nums) lineTo(nums[0], nums[1]); break;
      case 'c': nums = popNums(6); if (nums) curveTo(nums[0], nums[1], nums[2], nums[3], nums[4], nums[5]); break;
      case 'v':
        nums = popNums(4);
        if (nums && curPt) {
          const inv = ctm;
          const det = inv[0] * inv[3] - inv[1] * inv[2];
          let ox = curPt[0], oy = curPt[1];
          if (det !== 0) { ox = (inv[3] * (curPt[0] - inv[4]) - inv[2] * (curPt[1] - inv[5])) / det; oy = (-inv[1] * (curPt[0] - inv[4]) + inv[0] * (curPt[1] - inv[5])) / det; }
          curveTo(ox, oy, nums[0], nums[1], nums[2], nums[3]);
        }
        break;
      case 'y':
        nums = popNums(4);
        if (nums) curveTo(nums[0], nums[1], nums[2], nums[3], nums[2], nums[3]);
        break;
      case 'rmoveto': case 'rm':
        nums = popNums(2);
        if (nums) { if (curPt) { const p = [curPt[0] + nums[0] * ctm[0] + nums[1] * ctm[2], curPt[1] + nums[0] * ctm[1] + nums[1] * ctm[3]]; segs.push('M ' + f2(p[0]) + ' ' + f2(p[1])); curPt = p; subStart = p; } else moveTo(nums[0], nums[1]); }
        break;
      case 'rlineto': case 'rl': {
        nums = popNums(2);
        if (nums && curPt) {
          const p = [curPt[0] + nums[0] * ctm[0] + nums[1] * ctm[2], curPt[1] + nums[0] * ctm[1] + nums[1] * ctm[3]];
          segs.push('L ' + f2(p[0]) + ' ' + f2(p[1]));
          curPt = p;
        } else if (nums) moveTo(nums[0], nums[1]);
        break;
      }
      case 'rcurveto': case 'rc': {
        nums = popNums(6);
        if (nums && curPt) {
          const d = (dx, dy) => [dx * ctm[0] + dy * ctm[2], dx * ctm[1] + dy * ctm[3]];
          const a = d(nums[0], nums[1]), b = d(nums[2], nums[3]), c = d(nums[4], nums[5]);
          const p1 = [curPt[0] + a[0], curPt[1] + a[1]];
          const p2 = [curPt[0] + b[0], curPt[1] + b[1]];
          const p3 = [curPt[0] + c[0], curPt[1] + c[1]];
          segs.push('C ' + f2(p1[0]) + ' ' + f2(p1[1]) + ' ' + f2(p2[0]) + ' ' + f2(p2[1]) + ' ' + f2(p3[0]) + ' ' + f2(p3[1]));
          curPt = p3;
        }
        break;
      }
      case 'h': closePath(); break;
      case 're': {
        nums = popNums(4);
        if (nums) rectPath(nums[0], nums[1], nums[2], nums[3]);
        break;
      }
      case 'rectfill': nums = popNums(4); if (nums) { rectPath(nums[0], nums[1], nums[2], nums[3]); emit('f', 'nonzero'); } break;
      case 'rectstroke': nums = popNums(4); if (nums) { rectPath(nums[0], nums[1], nums[2], nums[3]); emit('s', 'nonzero'); } break;
      case 'arc':
        nums = popNums(5);
        if (nums) arcToSegs(nums[0], nums[1], nums[2], nums[3], nums[4], true);
        break;
      case 'arcn':
        nums = popNums(5);
        if (nums) arcToSegs(nums[0], nums[1], nums[2], nums[3], nums[4], false);
        break;
      case 'arcto': popNums(5); break;
      case 'n': segs = []; curPt = null; subStart = null; break;
      case 'f': case 'F': emit('f', 'nonzero'); break;
      case 'f*': emit('f', 'evenodd'); break;
      case 'S': emit('s', 'nonzero'); break;
      case 's': closePath(); emit('s', 'nonzero'); break;
      case 'B': emit('fs', 'nonzero'); break;
      case 'B*': emit('fs', 'evenodd'); break;
      case 'b': closePath(); emit('fs', 'nonzero'); break;
      case 'b*': closePath(); emit('fs', 'evenodd'); break;
      case 'rg': nums = popNums(3); if (nums) { fillColor = rgbStr(nums[0], nums[1], nums[2]); strokeColor = fillColor; } break;
      case 'RG': nums = popNums(3); if (nums) strokeColor = rgbStr(nums[0], nums[1], nums[2]); break;
      case 'g': nums = popNums(1); if (nums) { fillColor = rgbStr(nums[0], nums[0], nums[0]); strokeColor = fillColor; } break;
      case 'G': nums = popNums(1); if (nums) strokeColor = rgbStr(nums[0], nums[0], nums[0]); break;
      case 'k': nums = popNums(4); if (nums) { fillColor = cmykToRgb(nums[0], nums[1], nums[2], nums[3]); strokeColor = fillColor; } break;
      case 'K': nums = popNums(4); if (nums) strokeColor = cmykToRgb(nums[0], nums[1], nums[2], nums[3]); break;
      case 'w': nums = popNums(1); if (nums) lineWidth = Math.max(0.1, nums[0]); break;
      case 'd': popNums(1); clearStack(); break;
      case 'cm': nums = popNums(6); if (nums) concatCtm(nums); break;
      case 'translate': nums = popNums(2); if (nums) concatCtm([1, 0, 0, 1, nums[0], nums[1]]); break;
      case 'scale': nums = popNums(2); if (nums) concatCtm([nums[0], 0, 0, nums[1], 0, 0]); break;
      case 'rotate': {
        nums = popNums(1);
        if (nums) { const a = nums[0] * Math.PI / 180; concatCtm([Math.cos(a), Math.sin(a), -Math.sin(a), Math.cos(a), 0, 0]); }
        break;
      }
      case 'q':
        gsStack.push({ ctm: ctm.slice(), fillColor, strokeColor, lineWidth });
        break;
      case 'Q': {
        const s = gsStack.pop();
        if (s) { ctm = s.ctm; fillColor = s.fillColor; strokeColor = s.strokeColor; lineWidth = s.lineWidth; }
        break;
      }
      case 'BT': case 'ET': case 'Tj': case 'TJ': case 'Tf': case 'Td': case 'TD':
      case 'Tm': case 'T*': case "'": case '"': case 'show': case 'ashow':
      case 'widthshow': case 'awidthshow': case 'xshow': case 'yshow': case 'xyshow':
      case 'charpath': case 'findfont': case 'scalefont': case 'setfont':
        textSeen = true; clearStack(); break;
      case 'J': case 'j': case 'M': case 'i': case 'ri': case 'Tc': case 'Tw': case 'Tz': case 'TL':
      case 'setlinecap': case 'setlinejoin': case 'setmiterlimit': case 'setflat':
        popNums(1); break;
      case 'cs': case 'CS': case 'sc': case 'SC': case 'scn': case 'SCN': case 'sh': case 'gs':
      case 'setcolorspace': case 'setcolor': case 'setgray': case 'settransfer':
        clearStack(); break;
      case 'W': case 'W*': case 'clip': case 'eoclip': case 'rectclip':
        segs = []; curPt = null; subStart = null; break;
      case 'image': case 'colorimage': case 'imagemask':
        hasImage = true; clearStack(); break;
      case 'def': case 'load': case 'bind': case 'exec': case 'if': case 'ifelse':
      case 'for': case 'repeat': case 'loop': case 'exit': case 'dict': case 'begin': case 'end':
      case 'store': case 'put': case 'get': case 'array': case 'string':
        clearStack(); break;
      case 'showpage': case 'grestoreall': case 'save': case 'restore': case 'setbbox':
      case 'u': case 'U': case '*u': case '*U': case 'Np': case 'Lb': case 'LB': case 'Pb': case 'PB':
        break;
      default:
        warnings++;
        clearStack();
        break;
    }
  }
  if (textSeen) warnings++;

  // Flip Y: EPS origin is bottom-left, SVG is top-left. Applied as a
  // group transform using the bounding box (translate(-x0, y1) scale(1,-1)).
  return {
    width, height, bbox,
    shapes,
    flipTransform: 'translate(' + f2(-bbox.x0) + ' ' + f2(bbox.y1) + ') scale(1 -1)',
    warnings, textSeen, hasImage,
    hasShapes: shapes.length > 0
  };
}

function fcEpsToSvg(epsText) {
  const parsed = fcEpsParse(epsText);
  if (!parsed.hasShapes) return { svg: null, parsed };
  const paths = parsed.shapes.map((s) => {
    const attrs = ['d="' + s.d + '"'];
    attrs.push('fill="' + s.fill + '"');
    if (s.fillRule === 'evenodd') attrs.push('fill-rule="evenodd"');
    if (s.stroke !== 'none') {
      attrs.push('stroke="' + s.stroke + '"');
      attrs.push('stroke-width="' + s.strokeWidth + '"');
    }
    return '  <path ' + attrs.join(' ') + ' />';
  }).join('\n');
  const svg = '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + parsed.width + ' ' + parsed.height
    + '" width="' + parsed.width + '" height="' + parsed.height + '">\n'
    + '  <g transform="' + parsed.flipTransform + '">\n' + paths + '\n  </g>\n</svg>\n';
  return { svg, parsed };
}

// ---------- EPS preview bitmap (%%BeginPreview) ----------
// Many EPS files (Photoshop / Illustrator) embed a small preview image as
// hex data. Returns {width, height, rgba} or null. Depth 1 = 1-bit (1=black),
// depth 8 = grayscale, depth 24 = RGB.
function fcEpsFindPreview(epsText) {
  const text = String(epsText || '');
  const m = text.match(/%%BeginPreview:\s*(\d+)\s+(\d+)\s+(\d+)\s+(\d+)/);
  if (!m) return null;
  const w = parseInt(m[1], 10), h = parseInt(m[2], 10), depth = parseInt(m[3], 10);
  if (!w || !h || w > 4000 || h > 4000) return null;
  const start = text.indexOf('\n', m.index + m[0].length) + 1;
  let end = text.indexOf('%%EndPreview', start);
  if (end === -1) end = text.length;
  const hex = text.slice(start, end).replace(/[^0-9A-Fa-f]/g, '');
  if (hex.length < 2) return null;
  const bytesPerLine = Math.ceil((w * depth) / 8);
  const need = bytesPerLine * h;
  const totalBytes = Math.floor(hex.length / 2);
  if (totalBytes < need * 0.5) return null; // too little data to be useful
  const bytes = new Uint8Array(Math.min(totalBytes, need));
  for (let k = 0; k < bytes.length; k++) bytes[k] = parseInt(hex.substr(k * 2, 2), 16);
  const rgba = new Uint8ClampedArray(w * h * 4);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const o = (y * w + x) * 4;
      if (depth === 1) {
        const byte = bytes[y * bytesPerLine + ((x / 8) | 0)] || 0;
        const bit = (byte >> (7 - (x % 8))) & 1;
        const v = bit ? 0 : 255; // 1 = black
        rgba[o] = v; rgba[o + 1] = v; rgba[o + 2] = v; rgba[o + 3] = 255;
      } else if (depth === 8) {
        const v = bytes[y * bytesPerLine + x] || 0;
        rgba[o] = v; rgba[o + 1] = v; rgba[o + 2] = v; rgba[o + 3] = 255;
      } else if (depth === 24) {
        const j = (y * bytesPerLine + x * 3);
        rgba[o] = bytes[j] || 0; rgba[o + 1] = bytes[j + 1] || 0; rgba[o + 2] = bytes[j + 2] || 0; rgba[o + 3] = 255;
      } else {
        return null;
      }
    }
  }
  return { width: w, height: h, rgba };
}

// ---------- TIFF preview offset (DOS EPS / embedded TIFF) ----------
// Returns the byte offset of a TIFF header (II*\0 or MM\0*) or -1.
function fcEpsTiffOffset(bytes) {
  if (!bytes || bytes.length < 4) return -1;
  // DOS EPS header: TIFF offset lives at bytes 12..15 (little-endian)
  if (bytes[0] === 0xC5 && bytes[1] === 0xD0 && bytes[2] === 0xD3 && bytes[3] === 0xC6 && bytes.length >= 20) {
    const off = bytes[12] | (bytes[13] << 8) | (bytes[14] << 16) | (bytes[15] << 24);
    if (off > 0 && off < bytes.length - 4) return off;
  }
  const limit = Math.min(bytes.length - 4, 2097152);
  for (let k = 0; k < limit; k++) {
    if (bytes[k] === 0x49 && bytes[k + 1] === 0x49 && bytes[k + 2] === 0x2A && bytes[k + 3] === 0x00) return k;
    if (bytes[k] === 0x4D && bytes[k + 1] === 0x4D && bytes[k + 2] === 0x00 && bytes[k + 3] === 0x2A) return k;
  }
  return -1;
}


/* ================= FILE CONVERTER (new tool tab) =================
   Upload any file — PNG / JPG / WebP / GIF / BMP / SVG / EPS / AI / PDF —
   convert it to PNG, JPG, WebP, SVG or PDF. 100% client-side.
   - Raster <-> raster: canvas
   - Raster -> SVG: embed (exact) or trace to real vector (ImageTracer, on demand)
   - SVG -> raster/PDF: rasterize
   - EPS -> anything: mini PostScript parser (fc-engine.js, simple vector shapes only)
   - AI/PDF -> raster/SVG/PDF: pdf.js renders page 1 (PDF-based AI only) */

const FC_TRACE_URL = "https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js";
const FC_UTIF_URL = "https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js";

let fcTracerPromise = null;
function fcLoadTracer() {
  if (window.ImageTracer) return Promise.resolve(window.ImageTracer);
  if (fcTracerPromise) return fcTracerPromise;
  fcTracerPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = FC_TRACE_URL;
    s.onload = () => {
      if (window.ImageTracer) resolve(window.ImageTracer);
      else { fcTracerPromise = null; reject(new Error("ImageTracer global missing")); }
    };
    s.onerror = () => { fcTracerPromise = null; reject(new Error("Trace library load failed")); };
    document.head.appendChild(s);
  });
  return fcTracerPromise;
}

let fcUtifPromise = null;
function fcLoadUtif() {
  if (window.UTIF) return Promise.resolve(window.UTIF);
  if (fcUtifPromise) return fcUtifPromise;
  fcUtifPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = FC_UTIF_URL;
    s.onload = () => {
      if (window.UTIF) resolve(window.UTIF);
      else { fcUtifPromise = null; reject(new Error("UTIF global missing")); }
    };
    s.onerror = () => { fcUtifPromise = null; reject(new Error("UTIF load failed")); };
    document.head.appendChild(s);
  });
  return fcUtifPromise;
}

// Build a canvas from raw RGBA pixels (used for EPS preview fallbacks),
// optionally scaled down to outW.
function fcCanvasFromRgba(width, height, rgba, outW) {
  const src = document.createElement("canvas");
  src.width = width; src.height = height;
  src.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(rgba), width, height), 0, 0);
  if (outW && outW !== "original" && width > outW) {
    const c = document.createElement("canvas");
    c.width = outW; c.height = Math.max(1, Math.round((height * outW) / width));
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return c;
  }
  return src;
}

function fcDownloadBlob(blob, name) {
  if (window.saveAs) { window.saveAs(blob, name); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function fcLoadImage(src) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error("Image load nahi ho saki"));
    im.src = src;
  });
}

function fcCanvasFromImage(im, outW) {
  const natW = im.naturalWidth || im.width, natH = im.naturalHeight || im.height;
  let w = natW, h = natH;
  if (outW && outW !== "original" && natW > outW) {
    w = outW; h = Math.max(1, Math.round((natH * outW) / natW));
  }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(im, 0, 0, w, h);
  return c;
}

function fcCanvasToBlob(canvas, format, quality, bg) {
  return new Promise((resolve, reject) => {
    const mime = format === "jpg" ? "image/jpeg" : format === "webp" ? "image/webp" : "image/png";
    if (format === "jpg" && bg) {
      const c = document.createElement("canvas");
      c.width = canvas.width; c.height = canvas.height;
      const ctx = c.getContext("2d");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(canvas, 0, 0);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("Encode failed"))), mime, quality);
      return;
    }
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("Encode failed"))), mime, quality);
  });
}

async function fcSvgTextToCanvas(svgText, outW) {
  const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  try {
    const im = await fcLoadImage(url);
    return fcCanvasFromImage(im, outW);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function fcPdfFirstPageToCanvas(arrayBuffer, outW) {
  if (!window.pdfjsLib) throw new Error("PDF engine load nahi hua — page refresh karo.");
  const doc = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await doc.getPage(1);
  const vp1 = page.getViewport({ scale: 1 });
  const maxDim = outW && outW !== "original" ? Math.min(outW, 2400) : 2000;
  const scale = Math.min(1, maxDim / Math.max(vp1.width, vp1.height)) || 1;
  const viewport = page.getViewport({ scale: Math.max(scale, 0.2) });
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.floor(viewport.width));
  canvas.height = Math.max(1, Math.floor(viewport.height));
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  return canvas;
}

async function fcCanvasToPdfBytes(canvas) {
  const DocCtor = (typeof PDFDocument !== "undefined" && PDFDocument)
    || (typeof PDFLib !== "undefined" && PDFLib.PDFDocument);
  if (!DocCtor) throw new Error("PDF engine load nahi hua — page refresh karo.");
  const pngBlob = await fcCanvasToBlob(canvas, "png", 1);
  const pngBytes = await pngBlob.arrayBuffer();
  const pdfDoc = await DocCtor.create();
  const page = pdfDoc.addPage([canvas.width, canvas.height]);
  const embedded = await pdfDoc.embedPng(pngBytes);
  page.drawImage(embedded, { x: 0, y: 0, width: canvas.width, height: canvas.height });
  return await pdfDoc.save();
}

const FileConverter = () => {
  const [items, setItems] = useState([]); // {id,name,ext,kind,blob,buf,url,size,status,result,resultBlob,resultName,error,note}
  const [activeId, setActiveId] = useState(null);
  const [target, setTarget] = useState("png");
  const [jpgQuality, setJpgQuality] = useState(92);
  const [jpgBg, setJpgBg] = useState("#ffffff");
  const [outWidth, setOutWidth] = useState("original");
  const [svgMode, setSvgMode] = useState("embed");
  const [busy, setBusy] = useState(false);
  const [batchRunning, setBatchRunning] = useState(false);
  const [batchInfo, setBatchInfo] = useState("");
  const [error, setError] = useState(null);
  const [dragOver, setDragOver] = useState(false);

  const fileInputRef = useRef(null);
  const idRef = useRef(0);

  const activeItem = items.find((it) => it.id === activeId) || null;
  const doneCount = items.filter((it) => it.status === "done").length;

  const addFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setError(null);
    const fresh = [];
    for (const f of files) {
      const buf = await f.arrayBuffer();
      const kind = fcDetectKind(f.name, new Uint8Array(buf.slice(0, 1048576)));
      fresh.push({
        id: ++idRef.current, name: f.name, kind, blob: f, buf,
        url: kind === "raster" || kind === "svg" ? URL.createObjectURL(f) : null,
        size: f.size, status: kind === "unknown" ? "error" : "queued",
        result: null, resultBlob: null, resultName: null,
        error: kind === "unknown" ? "Ye format support nahi hai." : null, note: null
      });
    }
    setItems((prev) => {
      if (activeId === null && fresh.length) setActiveId(fresh[0].id);
      return prev.concat(fresh);
    });
    setBatchInfo(fresh.length + " file" + (fresh.length > 1 ? "s" : "") + " add ho gayi — target format chuno aur Convert dabao.");
  };

  const removeItem = (id) => {
    setItems((prev) => {
      const it = prev.find((x) => x.id === id);
      if (it) { if (it.url) URL.revokeObjectURL(it.url); if (it.result) URL.revokeObjectURL(it.result); }
      const next = prev.filter((x) => x.id !== id);
      if (activeId === id) setActiveId(next.length ? next[0].id : null);
      return next;
    });
  };

  const clearAll = () => {
    items.forEach((it) => { if (it.url) URL.revokeObjectURL(it.url); if (it.result) URL.revokeObjectURL(it.result); });
    setItems([]); setActiveId(null); setBatchInfo(""); setError(null);
  };

  const markItem = (id, patch) => {
    setItems((prev) => prev.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  };

  // ---------- conversion core ----------
  const convertOne = async (item) => {
    const base = item.name.replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9_-]/g, "_") || "converted";
    const t = target;
    const outW = outWidth === "original" ? null : parseInt(outWidth, 10);
    const quality = jpgQuality / 100;
    let note = null;

    const rasterResult = async (canvas) => {
      if (t === "pdf") {
        const bytes = await fcCanvasToPdfBytes(canvas);
        return { blob: new Blob([bytes], { type: "application/pdf" }), name: base + ".pdf" };
      }
      if (t === "svg") {
        if (svgMode === "trace") {
          const tracer = await fcLoadTracer();
          const ctx = canvas.getContext("2d");
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const traced = tracer.imagedataToTracedata(imgData, { ltres: 1, qtres: 1, pathomit: 8, numberofcolors: 16, scale: 1 });
          const svgText = tracer.getSvgString(traced);
          return { blob: new Blob([svgText], { type: "image/svg+xml;charset=utf-8" }), name: base + ".svg", note: "Traced vector (approximate — logos/simple art par best)." };
        }
        const pngUrl = canvas.toDataURL("image/png");
        const svgText = fcSvgEmbed(pngUrl, canvas.width, canvas.height);
        return { blob: new Blob([svgText], { type: "image/svg+xml;charset=utf-8" }), name: base + ".svg", note: "SVG mein photo embed hai (exact copy, vector trace nahi)." };
      }
      const blob = await fcCanvasToBlob(canvas, t, quality, jpgBg);
      return { blob, name: base + "." + t };
    };

    if (item.kind === "raster") {
      const im = await fcLoadImage(item.url);
      const canvas = fcCanvasFromImage(im, outW);
      return await rasterResult(canvas);
    }

    if (item.kind === "svg") {
      const text = await item.blob.text();
      if (t === "svg") return { blob: item.blob, name: base + ".svg" };
      const canvas = await fcSvgTextToCanvas(text, outW);
      return await rasterResult(canvas);
    }

    if (item.kind === "eps") {
      const text = await item.blob.text();
      // Path 1: real vector shapes -> true vector SVG / rasterized PNG-JPG
      const { svg, parsed } = fcEpsToSvg(text);
      if (svg) {
        if (parsed.textSeen) note = "EPS mein text tha jo skip ho gaya (text convert nahi hota).";
        if (t === "svg") return { blob: new Blob([svg], { type: "image/svg+xml;charset=utf-8" }), name: base + ".svg", note: note || (parsed.shapes.length + " vector shapes convert hui.") };
        const canvas = await fcSvgTextToCanvas(svg, outW);
        const res = await rasterResult(canvas);
        if (!res.note) res.note = parsed.shapes.length + " vector shapes convert hui.";
        if (note) res.note = note;
        return res;
      }
      // Path 2: raster EPS (Photoshop) — use the embedded preview bitmap
      const preview = fcEpsFindPreview(text);
      if (preview) {
        const canvas = fcCanvasFromRgba(preview.width, preview.height, preview.rgba, outW);
        const res = await rasterResult(canvas);
        res.note = "Is EPS mein vector shapes nahi mili — is liye iska embedded preview image use hua hai (raster result).";
        return res;
      }
      // Path 3: DOS EPS / embedded TIFF preview
      const tiffOff = fcEpsTiffOffset(new Uint8Array(item.buf));
      if (tiffOff >= 0) {
        try {
          const UTIF = await fcLoadUtif();
          const ifds = UTIF.decode(item.buf.slice(tiffOff));
          if (ifds && ifds.length) {
            const ifd = ifds[0];
            UTIF.decodeImage(ifd);
            if (ifd.data && ifd.width && ifd.height) {
              const canvas = fcCanvasFromRgba(ifd.width, ifd.height, ifd.data, outW);
              const res = await rasterResult(canvas);
              res.note = "Is EPS mein vector shapes nahi mili — is liye iska TIFF preview image use hua hai (raster result).";
              return res;
            }
          }
        } catch (e) { console.error("TIFF preview failed:", e); }
      }
      throw new Error("Is EPS mein na vector shapes mili na preview image — ye raster/complex EPS hai jo browser mein convert nahi ho sakta." + (parsed.hasImage ? " (Ismein photo/image data hai.)" : ""));
    }

    if (item.kind === "ai" || item.kind === "pdf") {
      if (t === "pdf") return { blob: item.blob, name: base + ".pdf", note: item.kind === "ai" ? "AI file PDF-based thi, is liye as-it-is PDF save hui." : null };
      const canvas = await fcPdfFirstPageToCanvas(item.buf, outW);
      return await rasterResult(canvas);
    }

    throw new Error("Ye format convert nahi ho sakta.");
  };

  const processOne = async (item) => {
    markItem(item.id, { status: "processing", error: null, note: null });
    try {
      const res = await convertOne(item);
      const url = URL.createObjectURL(res.blob);
      markItem(item.id, { status: "done", result: url, resultBlob: res.blob, resultName: res.name, note: res.note || null });
      return true;
    } catch (err) {
      console.error(err);
      markItem(item.id, { status: "error", error: err.message || "Convert nahi ho saka." });
      return false;
    }
  };

  const handleConvertSelected = async () => {
    if (!activeItem || busy || batchRunning) return;
    setBusy(true); setError(null);
    await processOne(activeItem);
    setBusy(false);
  };

  const handleConvertAll = async () => {
    if (batchRunning || busy) return;
    const queue = items.filter((it) => it.status !== "done" && it.status !== "error");
    if (!queue.length) { setBatchInfo("Sab files pehle se done hain (ya error hain)."); return; }
    setBatchRunning(true); setError(null);
    let done = 0;
    for (let i = 0; i < queue.length; i++) {
      setBatchInfo("Convert ho raha hai: " + (i + 1) + " / " + queue.length + " — " + queue[i].name);
      const ok = await processOne(queue[i]);
      if (ok) done++;
    }
    setBatchInfo("Ho gaya! " + done + " / " + queue.length + " files convert ho gayin (" + target.toUpperCase() + ").");
    setBatchRunning(false);
  };

  const downloadItem = (item) => {
    if (item && item.resultBlob && item.resultName) fcDownloadBlob(item.resultBlob, item.resultName);
  };

  const downloadAllZip = async () => {
    const done = items.filter((it) => it.status === "done" && it.resultBlob);
    if (!done.length) { setError("Pehle kisi file ko convert karo."); return; }
    if (!window.JSZip) { setError("ZIP engine load nahi hua — page refresh karo."); return; }
    setBatchInfo("ZIP bana raha hoon…");
    try {
      const zip = new window.JSZip();
      done.forEach((it) => zip.file(it.resultName, it.resultBlob));
      const blob = await zip.generateAsync({ type: "blob" });
      fcDownloadBlob(blob, "converted-files.zip");
      setBatchInfo(done.length + " files ka ZIP download ho raha hai.");
    } catch (err) {
      setError("ZIP nahi ban saka — aik aik karke download karo.");
    }
  };

  const fmtSize = (b) => (b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB");

  const targetBtn = (f, label) => (
    <button key={f} onClick={() => setTarget(f)}
      className={`flex-1 px-3 py-2.5 rounded-xl font-display font-bold text-sm transition-all ${target === f ? "text-white shadow-lg" : "text-slate-300 hover:text-white bg-white/[.03] border border-white/10 hover:bg-white/[.06]"}`}
      style={target === f ? { background: "linear-gradient(100deg,#ff6b00,#F43F5E)" } : {}}>
      {label}
    </button>
  );

  return (
    <div className="max-w-7xl mx-auto px-4 pb-16">
      <div className="max-w-3xl mx-auto mt-8 rounded-3xl border border-white/10 bg-white/[.03] p-5">
            <div>

/* ---- pixel engine (from bg-engine.js, tested) ---- */
function bgColorDist(r1, g1, b1, r2, g2, b2) {
  const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
  return Math.sqrt(dr * dr + dg * dg + db * db);
}
function bgThresholdFromTolerance(tol) { return 6 + (tol / 100) * 160; }
function bgBuildPalette(img, maxColors) {
  const w = img.width, h = img.height, d = img.data;
  const step = Math.max(1, Math.floor((2 * (w + h)) / 220));
  const palette = [];
  const push = (i) => {
    const a = d[i + 3];
    if (a < 12) return;
    const r = d[i], g = d[i + 1], b = d[i + 2];
    for (let k = 0; k < palette.length; k++) {
      if (bgColorDist(r, g, b, palette[k][0], palette[k][1], palette[k][2]) < 14) return;
    }
    if (palette.length < (maxColors || 64)) palette.push([r, g, b]);
  };
  for (let x = 0; x < w; x += step) { push((x) * 4); push(((h - 1) * w + x) * 4); }
  for (let y = 0; y < h; y += step) { push((y * w) * 4); push((y * w + w - 1) * 4); }
  return palette;
}
function bgPixelMatchesPalette(img, idx, palette, threshold) {
  const d = img.data;
  if (d[idx + 3] < 12) return true;
  const r = d[idx], g = d[idx + 1], b = d[idx + 2];
  for (let k = 0; k < palette.length; k++) {
    if (bgColorDist(r, g, b, palette[k][0], palette[k][1], palette[k][2]) <= threshold) return true;
  }
  return false;
}
function bgFloodMask(img, threshold) {
  const w = img.width, h = img.height, n = w * h;
  const mask = new Uint8Array(n).fill(1);
  const palette = bgBuildPalette(img, 64);
  if (!palette.length) return mask;
  const removed = new Uint8Array(n);
  const stack = [];
  const trySeed = (x, y) => {
    const p = y * w + x;
    if (removed[p]) return;
    if (!bgPixelMatchesPalette(img, p * 4, palette, threshold)) return;
    removed[p] = 1; stack.push(p);
  };
  for (let x = 0; x < w; x++) { trySeed(x, 0); trySeed(x, h - 1); }
  for (let y = 0; y < h; y++) { trySeed(0, y); trySeed(w - 1, y); }
  while (stack.length) {
    const p = stack.pop();
    const x = p % w, y = (p / w) | 0;
    if (x > 0) { const q = p - 1; if (!removed[q] && bgPixelMatchesPalette(img, q * 4, palette, threshold)) { removed[q] = 1; stack.push(q); } }
    if (x < w - 1) { const q = p + 1; if (!removed[q] && bgPixelMatchesPalette(img, q * 4, palette, threshold)) { removed[q] = 1; stack.push(q); } }
    if (y > 0) { const q = p - w; if (!removed[q] && bgPixelMatchesPalette(img, q * 4, palette, threshold)) { removed[q] = 1; stack.push(q); } }
    if (y < h - 1) { const q = p + w; if (!removed[q] && bgPixelMatchesPalette(img, q * 4, palette, threshold)) { removed[q] = 1; stack.push(q); } }
  }
  for (let i = 0; i < n; i++) if (removed[i]) mask[i] = 0;
  return mask;
}
function bgChromaMask(img, target, threshold) {
  const n = img.width * img.height, d = img.data;
  const mask = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const j = i * 4;
    mask[i] = (d[j + 3] >= 12 && bgColorDist(d[j], d[j + 1], d[j + 2], target[0], target[1], target[2]) <= threshold) ? 0 : 1;
  }
  return mask;
}
function bgFeatherAlpha(mask, w, h, radius) {
  const n = w * h;
  const alpha = new Uint8ClampedArray(n);
  if (!radius || radius < 1) { for (let i = 0; i < n; i++) alpha[i] = mask[i] ? 255 : 0; return alpha; }
  const r = Math.min(10, Math.round(radius));
  let src = new Float32Array(n);
  for (let i = 0; i < n; i++) src[i] = mask[i] ? 255 : 0;
  for (let pass = 0; pass < 2; pass++) {
    const tmp = new Float32Array(n);
    for (let y = 0; y < h; y++) {
      let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[y * w + Math.max(0, Math.min(w - 1, x))];
      for (let x = 0; x < w; x++) {
        tmp[y * w + x] = acc / (2 * r + 1);
        const xa = Math.max(0, x - r), xb = Math.min(w - 1, x + r + 1);
        acc += src[y * w + xb] - src[y * w + xa];
      }
    }
    const tmp2 = new Float32Array(n);
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[Math.max(0, Math.min(h - 1, y)) * w + x];
      for (let y = 0; y < h; y++) {
        tmp2[y * w + x] = acc / (2 * r + 1);
        const ya = Math.max(0, y - r), yb = Math.min(h - 1, y + r + 1);
        acc += tmp[yb * w + x] - tmp[ya * w + x];
      }
    }
    src = tmp2;
  }
  for (let i = 0; i < n; i++) alpha[i] = src[i];
  return alpha;
}
function bgDespeckle(mask, w, h) {
  const n = w * h, out = new Uint8Array(mask);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const p = y * w + x;
    if (out[p]) continue;
    let c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      if (out[(y + dy) * w + x + dx]) c++;
    }
    if (c === 8) out[p] = 1;
  }
  const label = new Int32Array(n).fill(-1);
  const stack = [];
  let nextId = 0;
  const sizes = [];
  for (let s = 0; s < n; s++) {
    if (!out[s] || label[s] !== -1) continue;
    let size = 0;
    label[s] = nextId; stack.push(s);
    while (stack.length) {
      const p = stack.pop(); size++;
      const x = p % w, y = (p / w) | 0;
      const nb = [];
      if (x > 0) nb.push(p - 1);
      if (x < w - 1) nb.push(p + 1);
      if (y > 0) nb.push(p - w);
      if (y < h - 1) nb.push(p + w);
      for (let k = 0; k < nb.length; k++) { const q = nb[k]; if (out[q] && label[q] === -1) { label[q] = nextId; stack.push(q); } }
    }
    sizes[nextId] = size; nextId++;
  }
  for (let i = 0; i < n; i++) { if (out[i] && sizes[label[i]] < 4) out[i] = 0; }
  return out;
}
function bgKeepLargest(mask, w, h) {
  const n = w * h;
  const label = new Int32Array(n).fill(-1);
  let bestId = -1, bestSize = 0, nextId = 0;
  const stack = [];
  for (let s = 0; s < n; s++) {
    if (!mask[s] || label[s] !== -1) continue;
    let size = 0;
    label[s] = nextId; stack.push(s);
    while (stack.length) {
      const p = stack.pop(); size++;
      const x = p % w, y = (p / w) | 0;
      const nb = [];
      if (x > 0) nb.push(p - 1);
      if (x < w - 1) nb.push(p + 1);
      if (y > 0) nb.push(p - w);
      if (y < h - 1) nb.push(p + w);
      for (let k = 0; k < nb.length; k++) { const q = nb[k]; if (mask[q] && label[q] === -1) { label[q] = nextId; stack.push(q); } }
    }
    if (size > bestSize) { bestSize = size; bestId = nextId; }
    nextId++;
  }
  const out = new Uint8Array(n);
  if (bestId >= 0) for (let i = 0; i < n; i++) if (label[i] === bestId) out[i] = 1;
  return out;
}
function bgApplyMask(img, alpha) {
  const d = img.data, n = img.width * img.height;
  const out = new Uint8ClampedArray(d.length);
  for (let i = 0; i < n; i++) {
    const j = i * 4, a = alpha[i] / 255;
    out[j] = d[j]; out[j + 1] = d[j + 1]; out[j + 2] = d[j + 2];
    out[j + 3] = Math.round(d[j + 3] * a);
  }
  return out;
}
function bgCountKept(mask) { let c = 0; for (let i = 0; i < mask.length; i++) if (mask[i]) c++; return c; }

function bgDownloadBlob(blob, name) {
  if (window.saveAs) { window.saveAs(blob, name); return; }

}
function bgLoadSampleScene() {

  c.width = 900; c.height = 600;
  const x = c.getContext("2d");
  x.fillStyle = "#ffb057"; x.fillRect(0, 0, 900, 600);
  x.fillStyle = "#FDE047";
  x.beginPath(); x.arc(120, 110, 62, 0, Math.PI * 2); x.fill();
  x.fillStyle = "#22C55E";
  x.beginPath(); x.ellipse(450, 640, 560, 190, 0, Math.PI, 0); x.fill();
  x.fillStyle = "#7C2D12"; x.fillRect(690, 300, 34, 150);
  x.fillStyle = "#16A34A";
  x.beginPath(); x.arc(707, 270, 86, 0, Math.PI * 2); x.fill();
  x.fillStyle = "#EF4444"; x.fillRect(220, 330, 260, 170);
  x.fillStyle = "#991B1B";
  x.beginPath(); x.moveTo(195, 335); x.lineTo(350, 235); x.lineTo(505, 335); x.closePath(); x.fill();
  x.fillStyle = "#FEF3C7";
  x.fillRect(250, 370, 56, 56); x.fillRect(394, 370, 56, 56); x.fillRect(322, 400, 56, 100);
  return c;
}

const BackgroundRemover = () => {
  const fileInputRef = useRef(null);
  const viewRef = useRef(null);
  const dataRef = useRef({});        // id -> {orig:{data,width,height}, mask, history:[], fileBlob}
  const idRef = useRef(0);
  const strokeRef = useRef(null);

  const [items, setItems] = useState([]); // {id,name,thumb,status:'idle'|'done',keptPct,width,height}
  const [activeId, setActiveId] = useState(null);
  const [tool, setTool] = useState("auto");
  const [tolerance, setTolerance] = useState(35);
  const [feather, setFeather] = useState(2);
  const [brushSize, setBrushSize] = useState(28);
  const [doDespeckle, setDoDespeckle] = useState(true);
  const [doKeepLargest, setDoKeepLargest] = useState(false);
  const [picked, setPicked] = useState(null);
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [aiBusy, setAiBusy] = useState(false);
  const [aiProgress, setAiProgress] = useState("");
  const [showOriginal, setShowOriginal] = useState(false);
  const [zoom, setZoom] = useState(100);
  const [jpgBg, setJpgBg] = useState("#ffffff");
  const [dragOver, setDragOver] = useState(false);
  const [copied, setCopied] = useState(false);
  const [, setTick] = useState(0);

  const activeItem = items.find((it) => it.id === activeId) || null;
  const activeData = activeId != null ? dataRef.current[activeId] : null;
  const doneCount = items.filter((it) => it.status === "done").length;

  const renderResult = useCallback((useFeather) => {
    const view = viewRef.current;
    const rec = activeId != null ? dataRef.current[activeId] : null;
    if (!view || !rec) return;
    const { orig, mask } = rec;
    const w = orig.width, h = orig.height;
    view.width = w; view.height = h;
    const ctx = view.getContext("2d");
    const item = items.find((it) => it.id === activeId);
    if (showOriginal || !item || item.status !== "done") {
      const img = ctx.createImageData(w, h);
      img.data.set(orig.data);
      ctx.putImageData(img, 0, 0);
      return;
    }
    const alpha = bgFeatherAlpha(mask, w, h, useFeather === false ? 0 : feather);
    const out = ctx.createImageData(w, h);
    out.data.set(bgApplyMask(orig, alpha));
    ctx.putImageData(out, 0, 0);
  }, [feather, showOriginal, activeId, items]);

  useEffect(() => { if (activeId != null) renderResult(true); }, [renderResult, activeId]);

  const pushHistory = (rec) => {
    rec.history.push(Uint8Array.from(rec.mask));
    if (rec.history.length > 20) rec.history.shift();
  };

  const adoptCanvas = (srcCanvas, name, fileBlob) => {
    const scale = Math.min(1, BG_MAX_DIM / Math.max(srcCanvas.width, srcCanvas.height));
    const w = Math.max(1, Math.round(srcCanvas.width * scale));
    const h = Math.max(1, Math.round(srcCanvas.height * scale));
    const work = document.createElement("canvas");
    work.width = w; work.height = h;
    const wx = work.getContext("2d");
    wx.drawImage(srcCanvas, 0, 0, w, h);
    const img = wx.getImageData(0, 0, w, h);
    const id = ++idRef.current;
    dataRef.current[id] = {
      orig: { data: img.data, width: w, height: h },
      mask: new Uint8Array(w * h).fill(1),
      history: [], fileBlob: fileBlob || null
    };
    const thumb = work.toDataURL("image/jpeg", 0.7);
    setItems((prev) => [...prev, { id, name: name || "image", thumb, status: "idle", keptPct: 100, width: w, height: h }]);
    setActiveId(id);
    setPicked(null);
    return id;
  };

  const loadFile = (file) => {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) {
      setStatus("Sirf image files chahiye (PNG / JPG / WebP).");
      return;
    }
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); adoptCanvas(im, file.name.replace(/\.[^.]+$/, ""), file); setStatus("Photo add ho gayi — Remove Background dabao."); };
    im.onerror = () => setStatus("Ye image khul nahi saki — koi aur file try karo.");
    im.src = url;
  };

  const addFiles = (fileList) => {
    Array.from(fileList || []).forEach((f) => loadFile(f));
  };

  const loadSample = () => { adoptCanvas(bgLoadSampleScene(), "sample-scene", null); setStatus("Sample scene load ho gayi — Remove Background try karo!"); };

  useEffect(() => {
    const onPaste = (e) => {
      const list = (e.clipboardData && e.clipboardData.items) || [];
      for (let i = 0; i < list.length; i++) {
        if (list[i].type.indexOf("image/") === 0) { loadFile(list[i].getAsFile()); break; }
      }
    };
    window.addEventListener("paste", onPaste);
    return () => window.removeEventListener("paste", onPaste);
  }, []);

  const removeItem = (id) => {
    delete dataRef.current[id];
    setItems((prev) => {
      const next = prev.filter((it) => it.id !== id);
      if (activeId === id) setActiveId(next.length ? next[0].id : null);
      return next;
    });
  };
  const clearAll = () => { dataRef.current = {}; setItems([]); setActiveId(null); setStatus(""); };

  /* ---- core removal for one item (offline, no CDN) ---- */
  const processItem = (id) => {
    const rec = dataRef.current[id];
    if (!rec) return 100;
    pushHistory(rec);
    const th = bgThresholdFromTolerance(tolerance);
    let mask;
    if (tool === "chroma" && picked) mask = bgChromaMask(rec.orig, picked, th);
    else mask = bgFloodMask(rec.orig, th);
    if (doDespeckle) mask = bgDespeckle(mask, rec.orig.width, rec.orig.height);
    if (doKeepLargest) mask = bgKeepLargest(mask, rec.orig.width, rec.orig.height);
    rec.mask = mask;
    return Math.round((bgCountKept(mask) / mask.length) * 100);
  };

  const doRemove = () => {
    if (activeId == null) return;
    setBusy(true); setStatus("Background hata raha hoon…");
    setTimeout(() => {
      try {
        const keptVal = processItem(activeId);
        setItems((prev) => prev.map((it) => it.id === activeId ? { ...it, status: "done", keptPct: keptVal } : it));
        setStatus(keptVal === 0 ? "Sab kuch remove ho gaya — tolerance kam karo ya color dobara pick karo." : "Ho gaya! " + keptVal + "% hissa bacha — brush se theek kar sakte ho.");
        setTick((t) => t + 1);
      } catch (err) { setStatus("Kuch garbar ho gayi — dobara try karo."); }
      setBusy(false);
    }, 30);
  };

  const doRemoveAll = () => {
    if (!items.length) return;
    setBusy(true); setStatus("Saari photos process ho rahi hain…");
    setTimeout(() => {
      try {
        const results = {};
        items.forEach((it) => { results[it.id] = processItem(it.id); });
        setItems((prev) => prev.map((it) => ({ ...it, status: "done", keptPct: results[it.id] })));
        setStatus("Ho gaya! " + items.length + " photos ka background hat gaya.");
        setTick((t) => t + 1);
      } catch (err) { setStatus("Kuch garbar ho gayi — dobara try karo."); }
      setBusy(false);
    }, 30);
  };

  /* ---- AI mode: OPTIONAL, lazy, timeout — fail ho to Smart mode chalta rehta hai ---- */
  const doAiRemove = async () => {
    const rec = activeData;
    if (!rec || activeId == null) return;
    setAiBusy(true); setAiProgress("AI model load ho raha hai… (pehli dafa ~40MB)"); setStatus("");
    try {
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 45000));
      const mod = await Promise.race([import(BG_AI_URL), timeout]);
      let blob = rec.fileBlob;
      if (!blob) {
        const c = document.createElement("canvas");
        c.width = rec.orig.width; c.height = rec.orig.height;
        const cx = c.getContext("2d");
        const img = cx.createImageData(rec.orig.width, rec.orig.height);
        img.data.set(rec.orig.data); cx.putImageData(img, 0, 0);
        blob = await new Promise((res) => c.toBlob(res, "image/png"));
      }
      setAiProgress("AI image parh raha hai…");
      const outBlob = await Promise.race([
        mod.removeBackground(blob, {
          publicPath: BG_AI_ASSETS,
          progress: (key, current, total) => { if (total) setAiProgress("AI: " + Math.round((current / total) * 100) + "%"); }
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 120000))
      ]);
      const url = URL.createObjectURL(outBlob);
      const im = new Image();
      await new Promise((resolve, reject) => { im.onload = resolve; im.onerror = reject; im.src = url; });
      URL.revokeObjectURL(url);
      pushHistory(rec);
      const scale = Math.min(1, BG_MAX_DIM / Math.max(im.width, im.height));
      const w = Math.max(1, Math.round(im.width * scale));
      const h = Math.max(1, Math.round(im.height * scale));
      const work = document.createElement("canvas");
      work.width = w; work.height = h;
      const wx = work.getContext("2d");
      wx.drawImage(im, 0, 0, w, h);
      const img2 = wx.getImageData(0, 0, w, h);
      const mask = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) { mask[i] = img2.data[i * 4 + 3] > 12 ? 1 : 0; img2.data[i * 4 + 3] = 255; }
      rec.orig = { data: img2.data, width: w, height: h };
      rec.mask = mask;
      const keptVal = Math.round((bgCountKept(mask) / mask.length) * 100);
      setItems((prev) => prev.map((it) => it.id === activeId ? { ...it, status: "done", keptPct: keptVal, width: w, height: h } : it));
      setStatus("AI ne background hata diya! Brush se edges theek kar sakte ho.");
      setTick((t) => t + 1);
    } catch (err) {
      setStatus("AI model load nahi hua (internet slow ya block) — koi baat nahi, Smart Remove offline chalta hai, wahi use karo.");
    }
    setAiBusy(false); setAiProgress("");
  };

  const doUndo = () => {
    const rec = activeData; if (!rec) return;
    const prevMask = rec.history.pop();
    if (!prevMask) { setStatus("Undo karne ko kuch nahi hai."); return; }
    rec.mask = prevMask;
    const keptVal = Math.round((bgCountKept(prevMask) / prevMask.length) * 100);
    setItems((prev) => prev.map((it) => it.id === activeId ? { ...it, status: "done", keptPct: keptVal } : it));
    setStatus("Undo ho gaya."); setTick((t) => t + 1);
  };
  const doReset = () => {
    const rec = activeData; if (!rec) return;
    pushHistory(rec);
    rec.mask = new Uint8Array(rec.orig.width * rec.orig.height).fill(1);
    setItems((prev) => prev.map((it) => it.id === activeId ? { ...it, status: "idle", keptPct: 100 } : it));
    setStatus("Reset ho gaya — original wapas aa gayi."); setTick((t) => t + 1);
  };

  const canvasPos = (e) => {
    const view = viewRef.current;
    const rect = view.getBoundingClientRect();
    return { x: ((e.clientX - rect.left) / rect.width) * view.width, y: ((e.clientY - rect.top) / rect.height) * view.height, scale: view.width / rect.width };
  };
  const paintAt = (x, y, scale, erase) => {
    const rec = activeData; if (!rec) return;
    const r = Math.max(1, (brushSize * scale) / 2);
    const w = rec.orig.width, h = rec.orig.height;
    const x0 = Math.max(0, Math.floor(x - r)), x1 = Math.min(w - 1, Math.ceil(x + r));
    const y0 = Math.max(0, Math.floor(y - r)), y1 = Math.min(h - 1, Math.ceil(y + r));
    for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
      const d = Math.sqrt((xx - x) * (xx - x) + (yy - y) * (yy - y));
      if (d <= r) rec.mask[yy * w + xx] = erase ? 0 : 1;
    }
  };
  const onPointerDown = (e) => {
    if (activeId == null || !activeData) return;
    const { x, y, scale } = canvasPos(e);
    if (tool === "chroma") {
      const orig = activeData.orig;
      const px = Math.min(orig.width - 1, Math.max(0, Math.floor(x)));
      const py = Math.min(orig.height - 1, Math.max(0, Math.floor(y)));
      const j = (py * orig.width + px) * 4;
      setPicked([orig.data[j], orig.data[j + 1], orig.data[j + 2]]);
      setStatus("Color pick ho gaya — ab Remove Background dabao.");
      return;
    }
    if (tool === "erase" || tool === "restore") {
      pushHistory(activeData);
      strokeRef.current = { erase: tool === "erase" };
      paintAt(x, y, scale, tool === "erase");
      setItems((prev) => prev.map((it) => it.id === activeId ? { ...it, status: "done" } : it));
      renderResult(false);
    }
  };
  const onPointerMove = (e) => {
    if (!strokeRef.current || activeId == null) return;
    const { x, y, scale } = canvasPos(e);
    paintAt(x, y, scale, strokeRef.current.erase);
    renderResult(false);
  };
  const endStroke = () => {
    if (strokeRef.current) {
      strokeRef.current = null;
      const rec = activeData;
      if (rec) {
        const keptVal = Math.round((bgCountKept(rec.mask) / rec.mask.length) * 100);
        setItems((prev) => prev.map((it) => it.id === activeId ? { ...it, keptPct: keptVal } : it));
      }
      renderResult(true);
    }
  };

  const resultCanvasFor = (id, withBg) => {
    const rec = dataRef.current[id]; if (!rec) return null;
    const item = items.find((it) => it.id === id);
    const w = rec.orig.width, h = rec.orig.height;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    if (withBg) { ctx.fillStyle = withBg; ctx.fillRect(0, 0, w, h); }
    const img = ctx.createImageData(w, h);
    if (item && item.status === "done") {
      const alpha = bgFeatherAlpha(rec.mask, w, h, feather);
      img.data.set(bgApplyMask(rec.orig, alpha));
    } else img.data.set(rec.orig.data);
    ctx.putImageData(img, 0, 0);
    return c;
  };
  const exportPNG = () => {
    if (activeId == null || !activeItem) return;
    const c = resultCanvasFor(activeId, null);
    if (c) c.toBlob((b) => b && bgDownloadBlob(b, activeItem.name + "-no-bg.png"), "image/png");
    setStatus("PNG download ho rahi hai (transparent background).");
  };
  const exportJPG = () => {
    if (activeId == null || !activeItem) return;
    const c = resultCanvasFor(activeId, jpgBg);
    if (c) c.toBlob((b) => b && bgDownloadBlob(b, activeItem.name + "-bg.jpg"), "image/jpeg", 0.92);
    setStatus("JPG download ho rahi hai.");
  };
  const downloadAllZip = async () => {
    const done = items.filter((it) => it.status === "done");
    if (!done.length) { setStatus("Pehle kam az kam aik photo process karo."); return; }
    if (!window.JSZip) { setStatus("ZIP engine load nahi hua — page refresh karo."); return; }
    setStatus("ZIP bana raha hoon…");
    try {
      const zip = new window.JSZip();
      for (const it of done) {
        const c = resultCanvasFor(it.id, null);
        if (!c) continue;
        const blob = await new Promise((res) => c.toBlob(res, "image/png"));
        if (blob) zip.file(it.name + "-no-bg.png", blob);
      }
      const blob = await zip.generateAsync({ type: "blob" });
      bgDownloadBlob(blob, "bg-removed-photos.zip");
      setStatus(done.length + " photos ka ZIP download ho raha hai.");
    } catch (err) { setStatus("ZIP nahi ban saka — aik aik karke download karo."); }
  };
  const copyPNG = async () => {
    if (activeId == null || !navigator.clipboard || !window.ClipboardItem) { setStatus("Is browser mein copy support nahi — PNG download use karo."); return; }
    try {
      const c = resultCanvasFor(activeId, null);
      const blob = await new Promise((res) => c.toBlob(res, "image/png"));
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      setCopied(true); setStatus("Copy ho gaya — Canva ya editor mein paste karo!");
      setTimeout(() => setCopied(false), 2500);
    } catch (err) { setStatus("Copy nahi ho saka — PNG download use karo."); }
  };

  const toolBtn = (id, icon, label) => (
    <button key={id} onClick={() => setTool(id)}
      className={`flex-1 inline-flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-[13px] font-bold transition-all ${tool === id ? "text-white shadow-lg" : "text-slate-300 hover:text-white hover:bg-white/[.06] bg-white/[.03] border border-white/10"}`}
      style={tool === id ? { background: "linear-gradient(100deg,#ff6b00,#ff6b00)" } : {}}>
      <i className={"fas " + icon}></i> {label}
    </button>
  );

  return (
    <div className="max-w-7xl mx-auto px-4 pb-16">
      {!items.length ? (
        <div className="max-w-3xl mx-auto mt-8">
          <div
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={(e) => { e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer.files); }}
            className={`rounded-3xl border-2 border-dashed px-6 py-14 text-center cursor-pointer transition-all ${dragOver ? "border-emerald-400 bg-emerald-400/10 scale-[1.01]" : "border-white/20 bg-white/[.03] hover:border-emerald-400/60 hover:bg-white/[.05]"}`}>
            <div className="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-2xl text-white shadow-lg" style={{ background: "linear-gradient(135deg,#ff6b00,#ff6b00)" }}>
              <i className="fas fa-cloud-arrow-up"></i>
            </div>
            <p className="font-display font-bold text-xl mt-5">Photos yahan drag &amp; drop karo</p>
            <p className="text-slate-400 text-sm mt-2">Aik saath kayi photos bhi chalengi — PNG, JPG, WebP • paste bhi kar sakte ho (Ctrl+V)</p>
            <p className="text-emerald-300 text-sm mt-4 font-semibold">100% free + offline engine — photo kahin upload nahi hoti, koi model download nahi chahiye</p>
          </div>
          <div className="text-center mt-5">
            <button onClick={loadSample} className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-white/[.06] border border-white/15 text-sm font-bold text-slate-200 hover:bg-white/[.10] transition-all">
              <i className="fas fa-image"></i> Bina photo ke try karo — Sample Scene
            </button>
          </div>
          <div className="grid grid-cols-3 gap-3 mt-8 text-center">
            {[
              ["fa-cloud-arrow-up", "1. Upload karo", "Aik ya kayi photos aik sath"],
              ["fa-wand-magic-sparkles", "2. Remove karo", "Smart Auto — aik click, offline"],
              ["fa-download", "3. Download karo", "Transparent PNG ya ZIP (sab)"]
            ].map((s) => (
              <div key={s[1]} className="rounded-2xl bg-white/[.03] border border-white/10 px-3 py-4">
                <i className={"fas " + s[0] + " text-emerald-400 text-lg"}></i>
                <p className="font-bold text-sm mt-2">{s[1]}</p>
                <p className="text-slate-400 text-xs mt-1">{s[2]}</p>
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div className="grid lg:grid-cols-[1fr_340px] gap-5 mt-8 items-start">
          <div>
            <div className="rounded-3xl border border-white/10 bg-white/[.03] p-3 sm:p-4">
              <div className="flex justify-between items-center mb-3 flex-wrap gap-2">
                <p className="text-xs font-bold text-slate-300 uppercase tracking-wide">
                  <i className="fas fa-layer-group mr-1.5 text-emerald-400"></i> Photos ({items.length}) • Done: {doneCount}
                </p>
                <div className="flex gap-2">
                  <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="px-3 py-1.5 rounded-lg bg-white/[.06] border border-white/15 text-xs font-bold text-slate-200 hover:bg-white/[.10]">
                    <i className="fas fa-plus mr-1"></i> Add More
                  </button>
                  <button onClick={clearAll} className="px-3 py-1.5 rounded-lg bg-white/[.06] border border-white/15 text-xs font-bold text-red-400 hover:bg-red-500/10">
                    <i className="fas fa-trash-can mr-1"></i> Clear All
                  </button>
                </div>
              </div>
              <div className="grid grid-cols-4 sm:grid-cols-6 gap-2 mb-4">
                {items.map((it) => (
                  <div key={it.id} onClick={() => setActiveId(it.id)}
                    className={`relative rounded-xl overflow-hidden cursor-pointer border-2 transition-all ${activeId === it.id ? "border-emerald-400" : "border-white/10 hover:border-white/30"}`}>
                    <img src={it.thumb} alt={it.name} className="w-full h-16 object-cover" />
                    <span className={`absolute top-1 right-1 w-5 h-5 rounded-full flex items-center justify-center text-[10px] text-white ${it.status === "done" ? "bg-emerald-500" : "bg-slate-600"}`}>
                      <i className={`fas ${it.status === "done" ? "fa-check" : "fa-clock"}`}></i>
                    </span>
                    <button onClick={(e) => { e.stopPropagation(); removeItem(it.id); }}
                      className="absolute top-1 left-1 w-5 h-5 rounded-full bg-black/60 text-white text-[10px] flex items-center justify-center hover:bg-red-500">
                      <i className="fas fa-xmark"></i>
                    </button>
                    <p className="absolute bottom-0 inset-x-0 bg-black/60 text-[9px] text-white px-1.5 py-0.5 truncate">{it.name}</p>
                  </div>
                ))}
              </div>
              <div className="flex flex-wrap items-center gap-2 mb-3">
                {toolBtn("auto", "fa-wand-magic-sparkles", "Smart Auto")}
                {toolBtn("chroma", "fa-eye-dropper", "Pick a Color")}
                {toolBtn("erase", "fa-eraser", "Erase")}
                {toolBtn("restore", "fa-paintbrush", "Restore")}
              </div>
              <div className="rounded-2xl overflow-hidden flex items-center justify-center min-h-[280px]"
                style={{ background: "repeating-conic-gradient(#dcdce2 0% 25%, #f0f0f4 0% 50%) 50% / 22px 22px" }}>
                <canvas ref={viewRef}
                  onPointerDown={onPointerDown} onPointerMove={onPointerMove}

function bulkDataUrlBytes(dataUrl) {
  const b64 = String(dataUrl).split(",")[1] || "";
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

const BulkVectorConverter = () => {
  const [items, setItems] = useState([]);
  const [isProcessingAll, setIsProcessingAll] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [previewModalItem, setPreviewModalItem] = useState(null);

  // Global Batch Settings
  const [globalTargetFormat, setGlobalTargetFormat] = useState('eps');
  const [epsMode, setEpsMode] = useState('vector-trace');
  const [targetDpi, setTargetDpi] = useState(300); // 72, 150, 300, 600
  const [scalePercent, setScalePercent] = useState(100); // 25 to 400
  const [colorMode, setColorMode] = useState('original');
  const [monochromeThreshold, setMonochromeThreshold] = useState(128); // 1-255
  const [bgOption, setBgOption] = useState('transparent');
  const [customBgColor, setCustomBgColor] = useState('#ffffff');
  const [jpgQuality, setJpgQuality] = useState(92); // 1-100
  const [smoothCurves, setSmoothCurves] = useState(true);

  // Global orientation controls (To fix inverted/upside-down photos or scans)
  const [globalFlipV, setGlobalFlipV] = useState(false);
  const [globalRotation, setGlobalRotation] = useState(0);

  const fileInputRef = useRef(null);

  // Detect format from filename
  const detectFormat = (filename) => {
    const ext = filename.split('.').pop()?.toLowerCase();
    if (ext === 'png') return 'png';
    if (ext === 'jpg' || ext === 'jpeg') return 'jpg';
    if (ext === 'eps') return 'eps';
    if (ext === 'svg') return 'svg';
    if (ext === 'webp') return 'webp';
    if (ext === 'pdf') return 'pdf';
    return 'other';
  };

  // Helper to load image dimensions and preview
  const processNewFiles = async (fileList) => {
    const newItems = [];

    for (const file of fileList) {
      const format = detectFormat(file.name);
      let previewUrl = '';
      let width = 800;
      let height = 800;
      let rawText = undefined;

      try {
        if (format === 'eps') {
          // Read EPS as text to extract BoundingBox and PostScript
          rawText = await file.text();
          const bb = parseEpsBoundingBox(rawText);
          width = bb.width;
          height = bb.height;

          // Render EPS to a canvas snapshot for instant thumbnail preview
          const canvas = document.createElement('canvas');
          canvas.width = Math.min(width, 600);
          canvas.height = Math.min(height, 600);
          await renderEpsToCanvas(rawText, canvas);
          previewUrl = canvas.toDataURL('image/png');
        } else if (format === 'svg') {
          rawText = await file.text();
          const blob = new Blob([rawText], { type: 'image/svg+xml' });
          previewUrl = URL.createObjectURL(blob);
          const dims = await getImageDimensions(previewUrl);
          width = dims.width;
          height = dims.height;
        } else {
          // Standard raster (PNG, JPG, WebP)
          previewUrl = URL.createObjectURL(file);
          const dims = await getImageDimensions(previewUrl);
          width = dims.width;
          height = dims.height;
        }
      } catch (err) {
        console.warn(`Could not extract preview for ${file.name}:`, err);
        previewUrl = '';
      }

      newItems.push({
        id: `${file.name}-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`,
        file,
        name: file.name,
        size: file.size,
        originalFormat: format,
        previewUrl,
        width,
        height,
        rawText,
        rotation: 0,
        flipV: false,
        flipH: false,
        targetFormat: globalTargetFormat,
        status: 'idle',
        progress: 0
      });
    }

    setItems((prev) => [...prev, ...newItems]);
  };

  const handleDrop = async (e) => {
    e.preventDefault();
    setDragOver(false);
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      await processNewFiles(Array.from(e.dataTransfer.files));
    }
  };

  const handleFileInputChange = async (e) => {
    if (e.target.files && e.target.files.length > 0) {
      await processNewFiles(Array.from(e.target.files));
      e.target.value = '';
    }
  };

  const loadSample = async (sample) => {
    if (sample.format === 'eps') {
      const blob = new Blob([SAMPLE_EPS_TEXT], { type: 'application/postscript' });
      const file = new File([blob], sample.name, { type: 'application/postscript' });
      await processNewFiles([file]);
      return;
    }
    // Convert dataUri to File
    const res = await fetch(sample.dataUri);
    const blob = await res.blob();
    const file = new File([blob], sample.name, { type: blob.type });
    await processNewFiles([file]);
  };

  // EPS BoundingBox parser
  const parseEpsBoundingBox = (epsText) => {
    const bbMatch = epsText.match(/%%(?:HiRes)?BoundingBox:\s*(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/i);
    if (bbMatch) {
      const llx = parseFloat(bbMatch[1]);
      const lly = parseFloat(bbMatch[2]);
      const urx = parseFloat(bbMatch[3]);
      const ury = parseFloat(bbMatch[4]);
      const width = Math.max(1, Math.round(urx - llx));
      const height = Math.max(1, Math.round(ury - lly));
      return { llx, lly, urx, ury, width, height };
    }
    return { llx: 0, lly: 0, urx: 600, ury: 600, width: 600, height: 600 };
  };

  // Orientation Transformation Helper (to fix any upside-down or rotated images)
  const applyOrientationTransform = (
  canvas,
  flipV,
  flipH,
  rotation) =>
  {
    if (!flipV && !flipH && rotation === 0) return canvas;

    const w = canvas.width;
    const h = canvas.height;
    const isRotated90 = rotation % 180 !== 0;
    const newW = isRotated90 ? h : w;
    const newH = isRotated90 ? w : h;

    const out = document.createElement('canvas');
    out.width = newW;
    out.height = newH;
    const oCtx = out.getContext('2d');
    if (!oCtx) return canvas;

    oCtx.save();
    oCtx.translate(newW / 2, newH / 2);
    if (rotation !== 0) {
      oCtx.rotate(rotation * Math.PI / 180);
    }
    oCtx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
    oCtx.drawImage(canvas, -w / 2, -h / 2);
    oCtx.restore();

    return out;
  };

  // Render EPS file into Canvas 2D with exact upright orientation
  const renderEpsToCanvas = async (epsText, targetCanvas) => {
    const ctx = targetCanvas.getContext('2d');
    if (!ctx) return;

    const bb = parseEpsBoundingBox(epsText);
    const canvasWidth = targetCanvas.width;
    const canvasHeight = targetCanvas.height;

    // Clear
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    // Apply Background
    if (bgOption === 'white') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    } else if (bgOption === 'black') {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    } else if (bgOption === 'custom') {
      ctx.fillStyle = customBgColor;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    }

    // Check if EPS contains ASCIIHex colorimage
    const colorImageIdx = epsText.indexOf('colorimage');
    if (colorImageIdx !== -1) {
      const after = epsText.slice(colorImageIdx + 10);
      const hexMatch = after.match(/([0-9a-fA-F\s]{20,})>/);
      if (hexMatch) {
        const hex = hexMatch[1].replace(/\s+/g, '');
        const imgW = bb.width;
        const imgH = bb.height;

        // Create ImageData
        const imgData = ctx.createImageData(imgW, imgH);
        let hexIdx = 0;
        let pixelIdx = 0;

        for (let i = 0; i < imgW * imgH; i++) {
          if (hexIdx + 6 <= hex.length) {
            const r = parseInt(hex.substr(hexIdx, 2), 16) || 0;
            const g = parseInt(hex.substr(hexIdx + 2, 2), 16) || 0;
            const b = parseInt(hex.substr(hexIdx + 4, 2), 16) || 0;
            hexIdx += 6;

            imgData.data[pixelIdx] = r;
            imgData.data[pixelIdx + 1] = g;
            imgData.data[pixelIdx + 2] = b;
            imgData.data[pixelIdx + 3] = 255;
            pixelIdx += 4;
          }
        }

        // Check if the EPS file was created with an inverted user coordinate transformation
        // (e.g. legacy files with "0 H translate W -H scale" combined with matrix "[W 0 0 -H 0 H]")
        // or has bottom-up data. If so, draw upright!
        const beforeImg = epsText.slice(0, colorImageIdx);
        const hasFlippedUserScale = /[\d.-]+\s+-[\d.-]+\s+scale/.test(beforeImg);
        const matrixMatch = epsText.match(/\[\s*([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s*\]/);
        let flipVertically = false;
        if (matrixMatch) {
          const d = parseFloat(matrixMatch[4]);
          if (hasFlippedUserScale && d < 0 || !hasFlippedUserScale && d > 0) {
            flipVertically = true;
          }
        }

        const offscreen = document.createElement('canvas');
        offscreen.width = imgW;
        offscreen.height = imgH;
        const offCtx = offscreen.getContext('2d');
        if (offCtx) {
          offCtx.putImageData(imgData, 0, 0);
          if (flipVertically) {
            ctx.save();
