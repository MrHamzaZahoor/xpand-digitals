    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      setItems((prev) => prev.map((it, idx) => idx === i ? { ...it, status: 'processing', progress: 30 } : it));

      try {
        const result = await convertSingleItem(item);
        setItems((prev) => prev.map((it, idx) => idx === i ? {
          ...it,
          status: 'done',
          progress: 100,
          resultBlob: result.blob,
          resultUrl: result.url,
          resultWidth: result.width,
          resultHeight: result.height,
          resultSize: result.size
        } : it));
      } catch (err) {
        console.error(`Error converting ${item.name}:`, err);
        setItems((prev) => prev.map((it, idx) => idx === i ? {
          ...it,
          status: 'error',
          progress: 0,
          errorMessage: err.message || 'Conversion failed'
        } : it));
      }
    }

    setIsProcessingAll(false);
  };

  // Convert a single specific item
  const handleConvertItem = async (id) => {
    const item = items.find((it) => it.id === id);
    if (!item) return;

    setItems((prev) => prev.map((it) => it.id === id ? { ...it, status: 'processing', progress: 40 } : it));

    try {
      const result = await convertSingleItem(item);
      setItems((prev) => prev.map((it) => it.id === id ? {
        ...it,
        status: 'done',
        progress: 100,
        resultBlob: result.blob,
        resultUrl: result.url,
        resultWidth: result.width,
        resultHeight: result.height,
        resultSize: result.size
      } : it));
    } catch (err) {
      setItems((prev) => prev.map((it) => it.id === id ? {
        ...it,
        status: 'error',
        progress: 0,
        errorMessage: err.message || 'Failed'
      } : it));
    }
  };

  // Download a single item
  const handleDownloadItem = (item) => {
    if (!item.resultBlob) return;
    const baseName = item.name.replace(/\.[^/.]+$/, '');
    const ext = item.targetFormat;
    saveAs(item.resultBlob, `${baseName}.${ext}`);
  };

  // Download All as ZIP
  const handleDownloadAllZip = async () => {
    const doneItems = items.filter((it) => it.status === 'done' && it.resultBlob);
    if (doneItems.length === 0) return;

    const zip = new JSZip();
    const folder = zip.folder('SERBEX_Bulk_Converted_Files');

    for (const item of doneItems) {
      const baseName = item.name.replace(/\.[^/.]+$/, '');
      const ext = item.targetFormat;
      folder?.file(`${baseName}.${ext}`, item.resultBlob);
    }

    const content = await zip.generateAsync({ type: 'blob' });
    saveAs(content, `SERBEX_Bulk_Converted_${Date.now()}.zip`);
  };

  // Bulk set target format for all
  const applyTargetFormatToAll = (fmt) => {
    setGlobalTargetFormat(fmt);
    setItems((prev) => prev.map((it) => ({ ...it, targetFormat: fmt, status: 'idle', resultBlob: undefined, resultUrl: undefined })));
  };

  const removeItem = (id) => {
    setItems((prev) => prev.filter((it) => it.id !== id));
  };

  const clearAll = () => {
    setItems([]);
  };

  // Orientation Handlers (to fix inverted/upside-down images)
  const handleToggleFlipV = (id) => {
    setItems((prev) => prev.map((it) => it.id === id ? {
      ...it,
      flipV: !it.flipV,
      status: 'idle',
      resultBlob: undefined,
      resultUrl: undefined
    } : it));
  };

  const handleToggleFlipH = (id) => {
    setItems((prev) => prev.map((it) => it.id === id ? {
      ...it,
      flipH: !it.flipH,
      status: 'idle',
      resultBlob: undefined,
      resultUrl: undefined
    } : it));
  };

  const handleRotateItem = (id, deltaDeg) => {
    setItems((prev) => prev.map((it) => it.id === id ? {
      ...it,
      rotation: ((it.rotation + deltaDeg) % 360 + 360) % 360,
      status: 'idle',
      resultBlob: undefined,
      resultUrl: undefined
    } : it));
  };

  const handleGlobalFlipV = () => {
    setGlobalFlipV((prev) => !prev);
    setItems((prev) => prev.map((it) => ({ ...it, status: 'idle', resultBlob: undefined, resultUrl: undefined })));
  };

  const handleGlobalRotate = (deg) => {
    setGlobalRotation((prev) => ((prev + deg) % 360 + 360) % 360);
    setItems((prev) => prev.map((it) => ({ ...it, status: 'idle', resultBlob: undefined, resultUrl: undefined })));
  };

  const handleResetOrientation = () => {
    setGlobalFlipV(false);
    setGlobalRotation(0);
    setItems((prev) => prev.map((it) => ({
      ...it,
      flipV: false,
      flipH: false,
      rotation: 0,
      status: 'idle',
      resultBlob: undefined,
      resultUrl: undefined
    })));
  };

  // Summary stats
  const totalInputBytes = useMemo(() => items.reduce((acc, it) => acc + it.size, 0), [items]);
  const totalOutputBytes = useMemo(() => items.reduce((acc, it) => acc + (it.resultSize || 0), 0), [items]);
  const doneCount = useMemo(() => items.filter((it) => it.status === 'done').length, [items]);

  const formatFileSize = (bytes) => {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return `${parseFloat((bytes / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
  };

  return (
    <div className="w-full max-w-7xl mx-auto space-y-8 p-4 md:p-8 animate-fadeIn">
      {/* Top Header Banner */}
      <div className="bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 rounded-3xl p-6 md:p-10 text-white shadow-2xl relative overflow-hidden border border-white/20">
        <div className="absolute -right-12 -top-12 w-64 h-64 bg-white/10 rounded-full blur-3xl pointer-events-none" />
        <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
          <div>
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-xs font-black uppercase tracking-widest text-emerald-100 mb-3 border border-white/20">
              <LIcon n="Sparkles" className="w-4 h-4 text-emerald-200" />
              Next-Gen Universal File & Vector Studio
            </div>
            <h1 className="text-3xl md:text-5xl font-black tracking-tight uppercase">
              Bulk File & Vector Converter
            </h1>
            <p className="text-emerald-50 text-sm md:text-base font-medium max-w-3xl mt-2 leading-relaxed">
              Her kisam ki files ko bulk me convert aur edit karen: <strong className="text-white underline decoration-emerald-300">PNG ➔ EPS</strong>, <strong className="text-white underline decoration-emerald-300">EPS ➔ PNG</strong>, <strong className="text-white underline decoration-emerald-300">JPG ➔ EPS</strong>, <strong className="text-white underline decoration-emerald-300">EPS ➔ JPG</strong>, SVG, WebP aur PDF. Scalable Adobe PostScript bezier vector paths aur 300 DPI print-ready quality.
            </p>
          </div>

          <div className="flex flex-wrap items-center gap-3">
            <button
              onClick={() => fileInputRef.current?.click()}
              className="px-6 py-3.5 bg-white text-emerald-700 hover:bg-emerald-50 font-black rounded-xl shadow-lg transition-all hover:scale-105 active:scale-95 flex items-center gap-2 text-sm uppercase tracking-wider">
              
              <LIcon n="Upload" className="w-5 h-5" />
              Upload Files
            </button>
            <input
              ref={fileInputRef}
              type="file"
              multiple
              accept=".png,.jpg,.jpeg,.eps,.svg,.webp,.pdf,.bmp,.gif"
              onChange={handleFileInputChange}
              className="hidden" />
            
          </div>
        </div>
      </div>

      {/* 1-Click Test Presets */}
      <div className="bg-white/[.03] backdrop-blur-md rounded-2xl p-5 border border-white/10 shadow-md">
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">
            <LIcon n="Zap" className="w-4 h-4 text-emerald-500" />
            <h3 className="text-xs font-black uppercase tracking-widest text-slate-200">
              1-Click Instant Test Presets (Click to try instantly)
            </h3>
          </div>
          <span className="text-[11px] font-bold text-gray-400">Pre-built files ready for instant testing</span>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          {SAMPLES.map((sample, idx) =>
          <button
            key={idx}
            onClick={() => loadSample(sample)}
            className="flex items-center justify-between p-3.5 bg-white/[.04] hover:bg-emerald-50/60 :bg-emerald-950/30 rounded-xl border border-white/10 hover:border-emerald-400 transition-all text-left group">
            
              <div className="truncate mr-3">
                <div className="text-xs font-bold text-white truncate flex items-center gap-1.5">
                  <span className="px-1.5 py-0.5 rounded bg-emerald-100  text-emerald-700  text-[10px] font-black uppercase">
                    {sample.format}
                  </span>
                  {sample.name}
                </div>
                <div className="text-[11px] text-slate-400 truncate mt-0.5">
                  {sample.desc}
                </div>
              </div>
              <LIcon n="ArrowRight" className="w-4 h-4 text-gray-400 group-hover:text-emerald-500 group-hover:translate-x-1 transition-all flex-shrink-0" />
            </button>
          )}
        </div>
      </div>

      {/* Global Master Settings Bar */}
      <div className="bg-white/[.03] rounded-3xl p-6 border border-white/10 shadow-xl space-y-6">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-white/10">
          <div className="flex items-center gap-3">
            <div className="p-2.5 rounded-xl bg-emerald-100  text-emerald-600 ">
              <LIcon n="SlidersHorizontal" className="w-5 h-5" />
            </div>
            <div>
              <h2 className="text-base font-black text-white uppercase tracking-wider">
                Bulk Conversion & Editing Master Controls
              </h2>
              <p className="text-xs text-slate-400">
                Ye settings تمام files par aik sath apply hongi (or you can override per file below)
              </p>
            </div>
          </div>

          {/* Quick Target Format Pills */}
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-xs font-black uppercase text-slate-400 mr-1">Convert All To:</span>
            {['eps', 'png', 'jpg', 'svg', 'webp', 'pdf'].map((fmt) =>
            <button
              key={fmt}
              onClick={() => applyTargetFormatToAll(fmt)}
              className={`px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider transition-all shadow-sm ${
              globalTargetFormat === fmt ?
              'bg-emerald-600 text-white shadow-emerald-500/30 ring-2 ring-emerald-500' :
              'bg-white/[.07] text-slate-200 hover:bg-white/[.12]'}`
              }>
              
                {fmt}
              </button>
            )}
          </div>
        </div>

        {/* Control Grid */}
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          {/* 1. EPS Vector Mode */}
          <div className="space-y-2">
            <label className="text-xs font-black uppercase tracking-wider text-slate-200 flex items-center justify-between">
              <span>EPS Generation Mode</span>
              <span className="text-[10px] font-bold text-emerald-600 ">PostScript 3.0</span>
            </label>
            <select
              value={epsMode}
              onChange={(e) => setEpsMode(e.target.value)}
              className="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/15 text-xs font-bold text-white focus:ring-2 focus:ring-emerald-500">
              
              <option value="vector-trace">Vector Bezier Trace (Illustrator/Scalable)</option>
              <option value="postscript-image">300 DPI PostScript Image (Print Prepress)</option>
            </select>
            <p className="text-[10px] text-gray-400">
              {epsMode === 'vector-trace' ?
              'Har shape ko true vector PostScript bezier curves me convert karta hai.' :
              'High-res 300 DPI colorimage create karta hai for standard print shops.'}
            </p>
          </div>

          {/* 2. Resolution & Print DPI */}
          <div className="space-y-2">
            <label className="text-xs font-black uppercase tracking-wider text-slate-200 flex items-center justify-between">
              <span>Resolution / Print DPI</span>
              <span className="text-[10px] font-bold text-emerald-600 ">{targetDpi} DPI</span>
            </label>
            <select
              value={targetDpi}
              onChange={(e) => setTargetDpi(Number(e.target.value))}
              className="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/15 text-xs font-bold text-white focus:ring-2 focus:ring-emerald-500">
              
              <option value={72}>72 DPI (Standard Web & Screen)</option>
              <option value={150}>150 DPI (Balanced Medium)</option>
              <option value={300}>300 DPI (Professional Print / Vector standard)</option>
              <option value={600}>600 DPI (Ultra-Sharp Archival)</option>
            </select>
            <div className="flex items-center justify-between text-[10px] text-gray-400">
              <span>Scale: {scalePercent}%</span>
              <input
                type="range"
                min="25"
                max="300"
                step="25"
                value={scalePercent}
                onChange={(e) => setScalePercent(Number(e.target.value))}
                className="w-24 accent-emerald-500" />
              
            </div>
          </div>

          {/* 3. Color Mode & Threshold */}
          <div className="space-y-2">
            <label className="text-xs font-black uppercase tracking-wider text-slate-200 flex items-center justify-between">
              <span>Color Mode & Filter</span>
              <span className="text-[10px] font-bold text-emerald-600 ">{colorMode}</span>
            </label>
            <select
              value={colorMode}
              onChange={(e) => setColorMode(e.target.value)}
              className="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/15 text-xs font-bold text-white focus:ring-2 focus:ring-emerald-500">
              
              <option value="original">Full Color (Original RGB)</option>
              <option value="grayscale">Grayscale (B&W Tones)</option>
              <option value="monochrome">Monochrome Silhouette (High-Contrast Vector)</option>
              <option value="invert">Invert Colors (Negative)</option>
            </select>
            {colorMode === 'monochrome' &&
            <div className="flex items-center gap-2 pt-1">
                <span className="text-[10px] text-gray-400">Threshold:</span>
                <input
                type="range"
                min="10"
                max="245"
                value={monochromeThreshold}
                onChange={(e) => setMonochromeThreshold(Number(e.target.value))}
                className="w-full accent-emerald-500" />
              
                <span className="text-[10px] font-bold text-slate-300">{monochromeThreshold}</span>
              </div>
            }
          </div>

          {/* 4. Background Handling */}
          <div className="space-y-2">
            <label className="text-xs font-black uppercase tracking-wider text-slate-200 flex items-center justify-between">
              <span>Background Handling</span>
              <span className="text-[10px] font-bold text-emerald-600 ">{bgOption}</span>
            </label>
            <select
              value={bgOption}
              onChange={(e) => setBgOption(e.target.value)}
              className="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/15 text-xs font-bold text-white focus:ring-2 focus:ring-emerald-500">
              
              <option value="transparent">Preserve Transparency (Alpha)</option>
              <option value="white">Solid Crisp White (#FFFFFF)</option>
              <option value="black">Solid Black (#000000)</option>
              <option value="remove-bg">Auto Background Remove (Chroma)</option>
              <option value="custom">Custom Color Picker</option>
            </select>
            {bgOption === 'custom' &&
            <div className="flex items-center gap-2 pt-1">
                <input
                type="color"
                value={customBgColor}
                onChange={(e) => setCustomBgColor(e.target.value)}
                className="w-7 h-7 rounded border border-gray-300 cursor-pointer" />
              
                <span className="text-xs font-mono font-bold text-slate-300">{customBgColor}</span>
              </div>
            }
          </div>
        </div>

        {/* Global Orientation & Alignment Bar (Fix Ulti / Inverted Images) */}
        <div className="pt-4 border-t border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div className="flex items-center gap-2">
            <LIcon n="RotateCw" className="w-4 h-4 text-emerald-500" />
            <span className="text-xs font-black uppercase tracking-wider text-slate-200">
              Bulk Orientation (Fix Ulti / Upside-Down Images):
            </span>
            {(globalFlipV || globalRotation !== 0) &&
            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100  text-amber-700 ">
                {globalFlipV ? 'Flipped ↕️ ' : ''}{globalRotation !== 0 ? `${globalRotation}° 🔄` : ''}
              </span>
            }
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <button
              onClick={handleGlobalFlipV}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 border ${
              globalFlipV ?
              'bg-emerald-600 text-white border-emerald-500 shadow-md' :
              'bg-white/[.07] text-slate-200 border-white/15 hover:bg-white/[.12]'}`
              }
              title="Flip Vertical (All Files - Inverted files ko seedha karen)">
              
              <LIcon n="FlipVertical" className="w-3.5 h-3.5" />
              <span>↕️ Flip Vertical (Fix Ulti)</span>
            </button>
            <button
              onClick={() => handleGlobalRotate(90)}
              className="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/[.07] text-slate-200 border border-white/15 hover:bg-white/[.12] transition-all flex items-center gap-1.5"
              title="Rotate 90 degrees clockwise">
              
              <LIcon n="RotateCw" className="w-3.5 h-3.5" />
              <span>Rotate 90°</span>
            </button>
            <button
              onClick={() => handleGlobalRotate(180)}
              className="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/[.07] text-slate-200 border border-white/15 hover:bg-white/[.12] transition-all flex items-center gap-1.5"
              title="Rotate 180 degrees (Seedha karen)">
              
              <LIcon n="RotateCcw" className="w-3.5 h-3.5" />
              <span>Rotate 180°</span>
            </button>
            {(globalFlipV || globalRotation !== 0) &&
            <button
              onClick={handleResetOrientation}
              className="px-2.5 py-1.5 rounded-xl text-xs font-bold text-red-500 hover:bg-red-50 :bg-red-950/40 transition-all">
              
                Reset Orientation
              </button>
            }
          </div>
        </div>
      </div>

      {/* Upload Dropzone */}
      <div
        onDragOver={(e) => {e.preventDefault();setDragOver(true);}}
        onDragLeave={() => setDragOver(false)}
        onDrop={handleDrop}
        onClick={() => fileInputRef.current?.click()}
        className={`border-3 border-dashed rounded-3xl p-8 md:p-12 text-center transition-all cursor-pointer flex flex-col items-center justify-center gap-4 ${
        dragOver ?
        'border-emerald-500 bg-emerald-50/50  scale-[1.01]' :
        'border-white/15 bg-white/[.02] hover:border-emerald-400 hover:bg-emerald-50/20'}`
        }>
        
        <div className="w-16 h-16 rounded-2xl bg-emerald-100  text-emerald-600  flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
          <LIcon n="Upload" className="w-8 h-8" />
        </div>
        <div>
          <h3 className="text-lg md:text-xl font-black text-white uppercase tracking-wide">
            Drag & Drop Files Here or Click to Browse
          </h3>
          <p className="text-xs md:text-sm text-slate-400 mt-1">
            Supports <strong className="text-slate-200">PNG, EPS, JPG, SVG, WebP, PDF, BMP, GIF</strong> in bulk. Koi limit nahi hai.
          </p>
        </div>
        <div className="flex items-center gap-2 text-xs font-black uppercase text-emerald-600  bg-emerald-50  px-4 py-1.5 rounded-full border border-emerald-200 ">
          <LIcon n="ShieldCheck" className="w-4 h-4" />
          100% Client-Side Local & Private Processing
        </div>
      </div>

      {/* Batch Queue & File List */}
      {items.length > 0 &&
      <div className="space-y-6">
          {/* Action & Stats Bar */}
          <div className="bg-white/[.03] rounded-2xl p-4 md:p-6 border border-white/10 shadow-lg flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-center gap-4 flex-wrap">
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" />
                <span className="text-sm font-black text-white uppercase">
                  Queue: {items.length} Files
                </span>
              </div>
              <span className="text-xs text-gray-400">|</span>
              <span className="text-xs text-slate-400">
                Total Input: <strong className="text-slate-100">{formatFileSize(totalInputBytes)}</strong>
              </span>
              {totalOutputBytes > 0 &&
            <>
                  <span className="text-xs text-gray-400">|</span>
                  <span className="text-xs text-emerald-600  font-bold">
                    Converted: {doneCount}/{items.length} ({formatFileSize(totalOutputBytes)})
                  </span>
                </>
            }
            </div>

            <div className="flex items-center gap-3 flex-wrap">
              <button
              onClick={clearAll}
              className="px-4 py-2.5 rounded-xl border border-white/15 text-slate-300 hover:bg-white/[.10] text-xs font-black uppercase tracking-wider transition-all flex items-center gap-1.5">
              
                <LIcon n="Trash2" className="w-4 h-4" />
                Clear All
              </button>

              <button
              onClick={handleConvertAll}
              disabled={isProcessingAll}
              className="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-black uppercase tracking-wider rounded-xl shadow-lg shadow-emerald-500/20 transition-all hover:scale-105 active:scale-95 disabled:opacity-50 flex items-center gap-2">
              
                {isProcessingAll ?
              <>
                    <LIcon n="RefreshCw" className="w-4 h-4 animate-spin" />
                    Converting Queue...
                  </> :

              <>
                    <LIcon n="Zap" className="w-4 h-4" />
                    Convert All ({items.length})
                  </>
              }
              </button>

              {doneCount > 0 &&
            <button
              onClick={handleDownloadAllZip}
              className="px-6 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-black uppercase tracking-wider rounded-xl shadow-lg shadow-cyan-500/20 transition-all hover:scale-105 active:scale-95 flex items-center gap-2">
              
                  <LIcon n="Archive" className="w-4 h-4" />
                  Download All as ZIP ({doneCount})
                </button>
            }
            </div>
          </div>

          {/* Cards Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {items.map((item) =>
          <div
            key={item.id}
            className={`bg-white/[.03] rounded-2xl border p-4 shadow-md transition-all flex flex-col justify-between ${
            item.status === 'done' ?
            'border-emerald-500/60 ring-1 ring-emerald-500/30' :
            item.status === 'error' ?
            'border-red-500/60' :
            'border-white/10'}`
            }>
            
                {/* Card Header & Preview */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between gap-2">
                    <span className="px-2 py-0.5 rounded bg-emerald-100  text-emerald-700  text-[10px] font-black uppercase tracking-wider border border-emerald-300 ">
                      {item.originalFormat}
                    </span>
                    <div className="flex items-center gap-1">
                      <button
                    onClick={() => handleToggleFlipV(item.id)}
                    className={`p-1 rounded-md text-[10px] font-bold border transition-colors ${
                    item.flipV ?
                    'bg-amber-500 text-white border-amber-600' :
                    'bg-white/[.07] hover:bg-white/[.12] text-slate-200 border-white/15'}`
                    }
                    title="Flip Vertical (Fix Ulti / Inverted Image)">
                    
                        <LIcon n="FlipVertical" className="w-3.5 h-3.5" />
                      </button>
                      <button
                    onClick={() => handleRotateItem(item.id, 90)}
                    className="p-1 rounded-md text-[10px] font-bold bg-white/[.07] hover:bg-white/[.12] text-slate-200 border border-white/15 transition-colors"
                    title="Rotate 90° Clockwise">
                    
                        <LIcon n="RotateCw" className="w-3.5 h-3.5" />
                      </button>
                      <button
                    onClick={() => handleRotateItem(item.id, 180)}
                    className="p-1 rounded-md text-[10px] font-bold bg-white/[.07] hover:bg-white/[.12] text-slate-200 border border-white/15 transition-colors"
                    title="Rotate 180°">
                    
                        <LIcon n="RotateCcw" className="w-3.5 h-3.5" />
                      </button>
                      <button
                    onClick={() => removeItem(item.id)}
                    className="text-gray-400 hover:text-red-500 p-1 rounded-lg transition-colors ml-1"
                    title="Remove file">
                    
                        <LIcon n="Trash2" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>

                  {/* Thumbnail Previews */}
                  <div className="grid grid-cols-2 gap-2 bg-white/[.04] p-2 rounded-xl border border-white/10">
                    {/* Source Preview with Live Orientation Transform */}
                    <div className="relative aspect-square rounded-lg overflow-hidden bg-checkered flex items-center justify-center border border-white/10">
                      {item.previewUrl ?
                  <img
                    src={item.previewUrl}
                    alt={item.name}
                    className="w-full h-full object-contain p-1 transition-transform duration-200"
                    style={{
                      transform: `rotate(${((item.rotation + globalRotation) % 360 + 360) % 360}deg) scale(${item.flipH ? -1 : 1}, ${item.flipV !== globalFlipV ? -1 : 1})`
                    }} /> :


                  <LIcon n="FileImage" className="w-8 h-8 text-gray-400" />
                  }
                      <span className="absolute bottom-1 left-1 bg-black/70 text-white text-[9px] px-1.5 py-0.5 rounded font-bold uppercase">
                        Src ({item.originalFormat})
                      </span>
                    </div>

                    {/* Result Preview with Guaranteed Upright Thumbnail */}
                    <div className="relative aspect-square rounded-lg overflow-hidden bg-checkered flex items-center justify-center border border-white/10">
                      {item.status === 'done' && item.resultUrl ?
                  <div className="relative w-full h-full flex items-center justify-center">
                          <img
                      src={item.resultUrl}
                      alt="Converted preview"
                      className="w-full h-full object-contain p-1" />
                    
                          {item.targetFormat === 'eps' &&
                    <span className="absolute top-1 right-1 bg-emerald-600/90 text-white text-[8px] px-1.5 py-0.5 rounded font-black uppercase shadow">
                              Vector EPS
                            </span>
                    }
                          {item.targetFormat === 'pdf' &&
                    <span className="absolute top-1 right-1 bg-red-600/90 text-white text-[8px] px-1.5 py-0.5 rounded font-black uppercase shadow">
                              PDF
                            </span>
                    }
                        </div> :
                  item.status === 'processing' ?
                  <div className="flex flex-col items-center gap-1">
                          <LIcon n="RefreshCw" className="w-6 h-6 text-emerald-500 animate-spin" />
                          <span className="text-[10px] font-bold text-emerald-600">Converting...</span>
                        </div> :

                  <div className="text-center p-2 text-gray-400 text-[10px] font-bold uppercase">
                          Awaiting conversion
                        </div>
                  }
                      <span className="absolute bottom-1 left-1 bg-emerald-700 text-white text-[9px] px-1.5 py-0.5 rounded font-bold uppercase">
                        ➔ {item.targetFormat}
                      </span>
                    </div>
                  </div>

                  {/* Title & Metadata */}
                  <div>
                    <h4 className="text-xs font-black text-white truncate" title={item.name}>
                      {item.name}
                    </h4>
                    <div className="flex items-center justify-between text-[11px] text-slate-400 mt-0.5">
                      <span>{formatFileSize(item.size)}</span>
                      <span>{item.width} × {item.height}px</span>
                    </div>
                  </div>
                </div>

                {/* Target Format Selector & Actions */}
                <div className="mt-4 pt-3 border-t border-white/10 space-y-2">
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-[10px] font-black uppercase text-gray-400">Target Format:</span>
                    <select
                  value={item.targetFormat}
                  onChange={(e) => {
                    const newFmt = e.target.value;
                    setItems((prev) => prev.map((it) => it.id === item.id ? { ...it, targetFormat: newFmt, status: 'idle', resultBlob: undefined, resultUrl: undefined } : it));
                  }}
                  className="px-2.5 py-1 rounded-lg bg-white/[.07] text-xs font-black uppercase text-slate-100 border border-white/15">
                  
                      <option value="eps">EPS (Encapsulated PostScript)</option>
                      <option value="png">PNG (Transparent Raster)</option>
                      <option value="jpg">JPG (Photo Compression)</option>
                      <option value="svg">SVG (Scalable Vector)</option>
                      <option value="webp">WebP (Modern Web)</option>
                      <option value="pdf">PDF (Print Document)</option>
                    </select>
                  </div>

                  {/* Convert or Download button */}
                  {item.status === 'done' ?
              <div className="flex items-center gap-2">
                      <button
                  onClick={() => handleDownloadItem(item)}
                  className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black uppercase tracking-wider rounded-xl shadow-md transition-all flex items-center justify-center gap-1.5">
                  
                        <LIcon n="Download" className="w-3.5 h-3.5" />
                        Download .{item.targetFormat}
                      </button>
                      {item.resultUrl &&
                <button
                  onClick={() => setPreviewModalItem(item)}
                  className="p-2 rounded-xl bg-white/[.07] hover:bg-gray-200 text-slate-200 transition-colors"
                  title="Full Preview">
                  
                          <LIcon n="Eye" className="w-4 h-4" />
                        </button>
                }
                    </div> :

              <button
                onClick={() => handleConvertItem(item.id)}
                disabled={item.status === 'processing'}
                className="w-full py-2 bg-white/[.08] hover:bg-emerald-600 :bg-emerald-600 text-white text-xs font-black uppercase tracking-wider rounded-xl transition-all flex items-center justify-center gap-1.5 disabled:opacity-50">
                
                      {item.status === 'processing' ?
                <LIcon n="RefreshCw" className="w-3.5 h-3.5 animate-spin" /> :

                <LIcon n="ArrowRight" className="w-3.5 h-3.5" />
                }
                      Convert to .{item.targetFormat}
                    </button>
              }

                  {item.status === 'error' &&
              <p className="text-[10px] text-red-500 font-bold truncate">
                      {item.errorMessage || 'Error occurred'}
                    </p>
              }
                </div>
              </div>
          )}
          </div>
        </div>
      }

      {/* Feature & Technical Capabilities Footer */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4">
        <div className="bg-white/[.03] rounded-2xl p-5 border border-white/10 space-y-2">
          <div className="flex items-center gap-2 text-emerald-600  font-black text-xs uppercase tracking-wider">
            <LIcon n="Layers" className="w-4 h-4" />
            True Vector Bezier Tracing
          </div>
          <p className="text-xs text-slate-300 leading-relaxed">
            Raster PNG aur JPG images ko genuine Adobe PostScript Level 2/3 vector bezier curves me map karta hai. Adobe Illustrator, InDesign aur CorelDraw me perfectly editable.
          </p>
        </div>

        <div className="bg-white/[.03] rounded-2xl p-5 border border-white/10 space-y-2">
          <div className="flex items-center gap-2 text-teal-600  font-black text-xs uppercase tracking-wider">
            <LIcon n="Compass" className="w-4 h-4" />
            300 & 600 DPI Print-Ready
          </div>
          <p className="text-xs text-slate-300 leading-relaxed">
            EPS to PNG ya EPS to JPG conversion ke doran high-density multi-sampling use hoti hai taake print prepress ke liye razor-sharp outputs generate hon.
          </p>
        </div>

        <div className="bg-white/[.03] rounded-2xl p-5 border border-white/10 space-y-2">
          <div className="flex items-center gap-2 text-cyan-600  font-black text-xs uppercase tracking-wider">
            <LIcon n="Archive" className="w-4 h-4" />
            Bulk ZIP & Zero Limits
          </div>
          <p className="text-xs text-slate-300 leading-relaxed">
            Dozens of files aik sath process karen. Convert hone ke baad aik click se <code className="text-emerald-600 font-bold">.ZIP</code> archive download karen.
          </p>
        </div>
      </div>

      {/* Full Preview Modal */}
      {previewModalItem &&
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
          <div className="bg-[#ffffff] rounded-3xl max-w-3xl w-full p-6 border border-white/10 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-white/10">
              <div>
                <h3 className="text-base font-black text-white uppercase">
                  {previewModalItem.name}
                </h3>
                <span className="text-xs text-emerald-600  font-bold">
                  Converted to .{previewModalItem.targetFormat} ({previewModalItem.resultWidth} × {previewModalItem.resultHeight}px)
                </span>
              </div>
              <button
              onClick={() => setPreviewModalItem(null)}
              className="p-2 rounded-xl text-gray-400 hover:text-gray-600 :text-white">
              
                <LIcon n="Minimize2" className="w-5 h-5" />
              </button>
            </div>

            <div className="max-h-[60vh] overflow-auto flex items-center justify-center bg-checkered p-4 rounded-2xl border border-gray-200 ">
              {previewModalItem.resultUrl &&
            <img
              src={previewModalItem.resultUrl}
              alt="Converted"
              className="max-h-[50vh] object-contain rounded-lg shadow-lg" />

            }
            </div>

            <div className="flex items-center justify-end gap-3 pt-2">
              <button
              onClick={() => setPreviewModalItem(null)}
              className="px-5 py-2.5 rounded-xl border border-white/15 text-xs font-black uppercase text-slate-200">
              
                Close
              </button>
              <button
              onClick={() => {
                handleDownloadItem(previewModalItem);
                setPreviewModalItem(null);
              }}
              className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black uppercase tracking-wider flex items-center gap-2 shadow-lg">
              
                <LIcon n="Download" className="w-4 h-4" />
                Download .{previewModalItem.targetFormat}
              </button>
            </div>
          </div>
        </div>
      }
    </div>);

};

/* ---------- Plan state hook (gate script se sync) ---------- */
const useXpPlan = () => {
    const [s, setS] = useState(() => (window.XpPlan ? window.XpPlan.get() : { plan: "free", credits: 0, uses: {} }));
    useEffect(() => {
        if (!window.XpPlan) return;
        const f = () => setS(window.XpPlan.get());
        window.addEventListener("xp-plan", f);
        const t = setInterval(f, 2500);
        return () => { window.removeEventListener("xp-plan", f); clearInterval(t); };
    }, []);
    return s;
};

const ChatBot = ({ setPage }) => {
    const [open, setOpen] = useState(false);
    const [msgs, setMsgs] = useState([]);
    const [input, setInput] = useState("");
    const [typing, setTyping] = useState(false);
    const scrollRef = useRef(null);
    useEffect(() => {
        if (open && msgs.length === 0) {
            setMsgs([{ from: "bot", text: "Hi! I'm the Xpand Assistant. Ask me about services, free tools, tool plans & credits, or our Etsy shop.", actions: [{ label: "Open Tools", page: "tools" }, { label: "Tool Plans", page: "toolplans" }, { label: "Etsy Shop", page: "etsy" }] }]);
        }
    }, [open ]);
    useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [msgs, typing, open]);
    const send = (text) => {
        const msg = (text || input).trim();
        if (!msg) return;
        setMsgs((m) => [...m, { from: "user", text: msg }]);
        setInput("");
        setTyping(true);
        setTimeout(() => {
            setTyping(false);
            setMsgs((m) => [...m, { from: "bot", ...xpBotReply(msg) }]);
        }, 650);
    };
    const go = (a) => {
        if (a.href) { window.open(a.href, "_blank"); return; }
        setOpen(false);
        setPage(a.page);
    };
    const chips = ["Tool plans & prices", "What tools are free?", "Etsy bundles", "Amazon services", "Contact"];
    return (
        <div className="fixed bottom-5 right-5 z-[90] flex flex-col items-end gap-3">
            {open && (
                <div className="w-[92vw] max-w-sm h-[540px] max-h-[74vh] bg-white rounded-[1.7rem] shadow-[0_36px_80px_-20px_rgba(0,0,0,0.4)] border border-black/10 flex flex-col overflow-hidden page-fade">
                    <div className="bg-ink text-white px-5 py-4 flex items-center gap-3 shrink-0">
                        <span className="w-10 h-10 rounded-full bg-gradient-to-br from-accent to-accentdark flex items-center justify-center text-[15px]"><i className="fas fa-robot"></i></span>
                        <div className="flex-grow">
                            <p className="font-bold text-[15px] leading-tight">Xpand Assistant</p>
                            <p className="text-white/55 text-[12px] flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-green-400 inline-block"></span> Online — replies instantly</p>
                        </div>
                        <button onClick={() => setOpen(false)} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20"><i className="fas fa-times text-sm"></i></button>
                    </div>
                    <div ref={scrollRef} className="flex-grow overflow-y-auto bg-paper px-4 py-4 space-y-3">
                        {msgs.map((m, i) => (
                            <div key={i} className={m.from === "user" ? "flex flex-col items-end" : "flex flex-col items-start"}>
                                <div className={`max-w-[85%] px-4 py-2.5 text-[14px] leading-relaxed ${m.from === "user" ? "bg-accent text-white rounded-2xl rounded-br-md" : "bg-mist text-ink rounded-2xl rounded-bl-md border border-black/5"}`}>{m.text}</div>
                                {m.actions && m.actions.length > 0 && (
                                    <div className="flex flex-wrap gap-1.5 mt-2">
                                        {m.actions.map((a, j) => (
                                            <button key={j} onClick={() => go(a)} className="text-[12.5px] font-semibold px-3 py-1.5 rounded-full bg-white border border-accent/40 text-accentdark hover:bg-accent hover:text-white transition-colors">{a.label} <i className="fas fa-arrow-right text-[9px]"></i></button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ))}
                        {typing && (<div className="flex"><div className="bg-mist border border-black/5 rounded-2xl rounded-bl-md px-4 py-3 flex gap-1"><span className="w-1.5 h-1.5 rounded-full bg-sub animate-bounce"></span><span className="w-1.5 h-1.5 rounded-full bg-sub animate-bounce" style={{ animationDelay: "0.15s" }}></span><span className="w-1.5 h-1.5 rounded-full bg-sub animate-bounce" style={{ animationDelay: "0.3s" }}></span></div></div>)}
                    </div>
                    <div className="px-3 pt-2 shrink-0 bg-white">
                        <div className="flex flex-wrap gap-1.5">
                            {chips.map((c, i) => (<button key={i} onClick={() => send(c)} className="text-[12px] font-medium px-2.5 py-1.5 rounded-full bg-mist text-ink/70 hover:text-accent transition-colors">{c}</button>))}
                        </div>
                    </div>
                    <div className="p-3 flex items-center gap-2 shrink-0 bg-white">
                        <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") send(); }}
                            placeholder="Type your message..." className="flex-grow bg-mist rounded-full px-4 py-3 text-[14px] outline-none focus:ring-2 ring-accent/40 min-w-0" />
                        <button onClick={() => send()} className="w-11 h-11 shrink-0 rounded-full bg-accent text-white flex items-center justify-center hover:bg-accentdark transition-colors shadow-lg shadow-orange-500/30"><i className="fas fa-paper-plane text-sm"></i></button>
                    </div>
                </div>
            )}
            <button onClick={() => setOpen(!open)} className="w-14 h-14 rounded-full bg-accent text-white shadow-[0_16px_36px_-8px_rgba(255,107,0,0.6)] flex items-center justify-center text-[22px] hover:scale-105 active:scale-95 transition-transform" aria-label="Chat with Xpand Assistant">
                <i className={`fas ${open ? "fa-times" : "fa-comment-dots"}`}></i>
            </button>
        </div>
    );
};

                    case "home":
                        return (<>
                            <Hero setPage={setPage} />
                            <LogoMarquee />
                            <Stats />
                            <Services setPage={setPage} limit={8} />
                            <WhyUs />
                            <Process />
                            <Works setPage={setPage} limit={3} />
                            <EtsyListings limit={4} />
                            <ToolsTeaser setPage={setPage} />
                            <Testimonials />
                            <Estimator />
                            <Blog setPage={setPage} limit={3} />
                            <Faq />
                            <Contact />
                        </>);
                    case "amazon":
                        return (<><PageHero eyebrow="Amazon Growth" title="Sell more, stress less." sub="Private Label, Wholesale, PPC and everything in between — managed end to end." /><Services setPage={setPage} noHeader /><Contact /></>);
                    case "creative":
                        return (<><PageHero eyebrow="IT & Creative" title="Technology, beautifully built." sub="Web apps, mobile, AI and design systems engineered for the future." /><div className="max-w-6xl mx-auto px-5 pb-8"><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">{creativeServices.map((s, i) => <ServiceCard key={i} svc={s} badge={s.tech} i={i} />)}</div></div><Contact /></>);
                    case "works":
                        return (<><PageHero eyebrow="Portfolio" title="Results we're proud of." sub="Real brands, real numbers, real growth stories." /><Works noHeader /><Contact /></>);
                    case "pricing":
                        return (<><PageHero eyebrow="Pricing" title="Simple, transparent." sub="Choose a starting point — every engagement is tailored after a free consult." /><Pricing /><Estimator title="Or build your own." /><Contact /></>);
                    case "testimonials":
                        return (<><div className="pt-16"><Testimonials /></div><Contact /></>);
                    case "blog":
                        return (<><PageHero eyebrow="Insights" title="Learn the playbook." sub="Guides and breakdowns from the team behind 150+ launches." /><Blog noHeader /><Contact /></>);
                    case "about":
                        return (<><About /><Contact /></>);
                    case "careers":
                        return (<><Careers /><Contact /></>);
                    case "tools":
                        return <ToolsPage setPage={setPage} />;
                    case "etsy":
                        return (<><PageHero eyebrow="Etsy — Dijeetech" title="Design bundles on Etsy." sub="Instant digital downloads from our Dijeetech shop — crafted for makers, crafters and small brands." /><EtsyListings noHeader /><Contact /></>);
                    case "toolplans":
                        return (<><PageHero eyebrow="Tool Plans" title="Simple tool pricing." sub="Free forever with PNG downloads — ya Pro lo aur saare formats + credits unlock karo." /><ToolPlans setPage={setPage} /><Contact /></>);
                    case "contact":
                        return (<><div className="pt-16"><Contact /></div></>);
                    default:
                        return <Hero setPage={setPage} />;
                }
            };

            return (
                <div className="min-h-screen bg-paper font-sans flex flex-col">
                    <ScrollProgress />
                    <Navbar setPage={setPage} activePage={page} />
                    <main key={page} className="flex-grow page-enter">{renderPage()}</main>
                    <Footer setPage={setPage} />
                    <ChatBot setPage={setPage} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
